document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"afd61f3b-c624-4462-b2ba-0dc000ca050f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d3f55dcc-35ff-43e2-9841-4dfaf674fbfa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"59473a1e-7ab7-4a15-ac4b-eabd41e800a7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<!-- the site's own stylesheets, in the site's order. Nothing below redefines a token. -->\n<style>/* Seed design tokens. Extracted verbatim from index.html :root and css/delta.css :root. The site and /brand read this same file. */\n:root{\n  /* charcoal, the one theme: every page sits on a flat charcoal grey, panels are a step lighter, wells (fields, segmented controls)\n     a step darker, and surfaces get lighter as they come forward. The greys are neutral; blue is the only colour that is not\n     data: fills are the brand blue (#2E63E7, hover #4377F5), lines and accent text a lighter tint of it.\n     --paper is the well, --ink the text, --tile a quiet surface inside a panel, --field a text field. */\n  color-scheme:dark;\n  --bg:#16171A;\n  --paper:#121316; --card:#25272C; --raised:#30333A; --chip:rgba(255,255,255,.06); --mist:rgba(255,255,255,.07); --hover:rgba(255,255,255,.04);\n  --panel:rgba(31,33,37,.18); --panel-solid:#1F2125; --bar:rgba(22,23,26,.8);   /* frosted glass: panels at 18% over the dot field, which shows through the blur; --panel-solid stays opaque for sticky bars, art frames, inputs */\n  --panel-line:rgba(255,255,255,.1); --panel-shadow:none; --frost:blur(26px) saturate(130%);\n  --scrim:rgba(0,0,0,.6);\n  --ink:#F3F4F6; --ink-2:#D3D6DC; --muted:#9DA2AC; --faint:#868B95;\n  --navy:#5B8CFF; --navy-deep:#A4C0FF; --navy-soft:#52668F; --navy-wash:rgba(91,140,255,.15);\n  --solid:#2E63E7; --solid-hover:#4377F5; --accent:#2E63E7; --accent-hover:#4377F5;\n  --pill:rgba(46,99,231,.24); --pill-hover:rgba(46,99,231,.38);   /* the blue tint of the wallet button, also under every chosen segment */\n  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.17); --ring:rgba(91,140,255,.3); --err:#FF8B9C;\n  --warn:#E8B45C; --warn-line:rgba(232,180,92,.36); --warn-bg:rgba(232,180,92,.1); --warn-ink:#F3CB8A; --warn-ink-2:#EBD2A4; --warn-strong:#FFE1B0;\n  /* check results and the chips that carry them: pass, caution, fail */\n  --ok:#45DB93; --ok-ink:#7BE8B2; --ok-bg:rgba(69,219,147,.14); --ok-line:rgba(69,219,147,.3);\n  --caution:#F3BC58; --caution-ink:#F7D08A; --caution-bg:rgba(243,188,88,.14);\n  --bad:#FF7268; --bad-ink:#FF9B93; --bad-bg:rgba(255,114,104,.15);\n  --tile:rgba(255,255,255,.045); --field:#121316;\n  --lift:0 14px 40px -16px rgba(0,0,0,.6);\n  --sh-ind:rgba(0,0,0,.4); --sh-pop:rgba(0,0,0,.6); --sh-sheet:rgba(0,0,0,.65); --sh-toast:rgba(0,0,0,.6);\n  --col-side:clamp(330px,19vw,390px); --col-rail:clamp(370px,21vw,430px);   /* the side columns of a workspace */\n  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;\n  --serif:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;\n  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;\n  --ease-out:cubic-bezier(.22,1,.36,1); --fast:.18s; --dur:.28s;   /* one curve and two lengths for every hover, press, slide and entrance */\n  --ease:var(--ease-out); --out:var(--ease-out); --soft:var(--ease-out);\n  /* how far along a raise is: red, through yellow, to green at the target */\n  --progress:linear-gradient(90deg,#F2554C,#F6C445 50%,#34C17B);\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n\n/* css/delta.css additions */\n:root{\n  --well:#111215;                                                       /* a dark well: inputs, the search box, the seg track */\n  --grad-btn:linear-gradient(180deg,#5B8CFF 0%,#2E63E7 100%);          /* the primary button */\n  --grad-seg:linear-gradient(180deg,rgba(91,140,255,.34),rgba(46,99,231,.2));   /* a chosen segment, a rank badge */\n  --seg-line:rgba(91,140,255,.42);\n  --glow:0 0 0 1px rgba(91,140,255,.32),0 10px 28px -10px rgba(46,99,231,.8);\n  --glow-sm:0 0 14px -4px rgba(46,99,231,.7);\n  --lit:inset 0 1px 0 rgba(255,255,255,.14);                          /* the highlight along the top edge of anything raised */\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Project page, chat, Launch form and the Terminal's risk chips. Colours come from the tokens in index.html's :root:\n   charcoal greys with blue accents, one theme for the whole site. Rules written for \":is(.pp,.ws)\" set the scale of the\n   shared pieces (cards, fields, chips, lists) on the project page and on every other workspace page alike.\n   ========================================================================== */\n\n/* ==========================================================================\n   Project page. A workspace like the other app pages (index.html has the frame), with its own columns: from 1440px three\n   columns that scroll on their own (project and checks, the raise and tabs, the buy rail); from 1024px two columns with\n   the rail pinned on the right; below that one column: project, the raise, the rail, chart, tabs, checks.\n   Instrument Sans for text, Instrument Serif italic for the page titles, IBM Plex Mono for figures.\n   ========================================================================== */\n/* panels are 88% glass over the dot field (index.html, --panel and --frost); what sits inside them and has to stay\n   exact keeps a solid ground: tables, chart areas and read-only fields */\n.dtable,.tscroll,.pp-plot,.pp-svg,.donut,.pcols,#prows,.inp.ro{background:var(--panel-solid)}\n#prows{border-radius:0 0 17px 17px}\nbody:has(#view-app.fit:not([hidden])) .toasts{bottom:calc(52px + env(safe-area-inset-bottom,0px))}   /* clear of the foot line */\n\n.pp{display:flex;flex-direction:column;gap:18px;font-size:15px}\n.pp-side,.pp-main{display:contents}\n.pp-rail{display:flex;flex-direction:column;gap:18px;min-width:0}\n.pp-id,.pp-annw{order:1}.pp-fill{order:2}.pp-rail{order:3}.pp-fees,.pp-chart{order:4}.pp-tabs{order:5}.pp-side>.rail-card{order:6}\n.pp-pos:empty{display:none}\n@media (min-width:1024px) and (max-width:1439px){\n  .pp{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}\n  .pp-side>*,.pp-main>*{grid-column:1;min-width:0}\n  .pp-rail{grid-column:2;grid-row:1 / span 5;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain;border-radius:18px}\n  .pp:has(.pp-ann) .pp-rail{grid-row:1 / span 6}   /* the announcement strip is one more row beside it */\n}\n@media (min-width:1440px){\n  #presalePage{flex:1;min-height:0;display:flex;flex-direction:column}\n  .pp{flex:1;min-height:0;display:grid;grid-template-columns:var(--col-side) minmax(0,1fr) var(--col-rail);grid-template-rows:minmax(0,1fr)}\n  .pp-side,.pp-main,.pp-rail{display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-radius:18px}\n  .pp-side>*,.pp-main>*,.pp-rail>*{order:0;flex:none}\n  .pp-main>.pp-tabs{flex:1 0 auto}\n  /* the chat takes what is left of the side column and scrolls inside itself, so the message box stays in reach */\n  .pp-side>.chat-card{flex:1 1 0;min-height:560px}\n  .pp-side>.chat-card .chat-list{max-height:none}\n  /* the tabs stay in reach while the middle column scrolls */\n  .tabbar{position:sticky;top:0;z-index:2;background:var(--panel-solid)}\n}\n\n/* source pills and check chips */\n.tag.demo-pill{background:transparent;border-style:dashed;color:var(--muted);font-weight:400}\n.tag.standin-pill{background:var(--caution-bg);border-color:var(--warn-line);color:var(--warn-ink)}\n.tag.live-pill{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}\n.risk-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 9px 3px 7px;border:1px solid transparent;white-space:nowrap}\n.risk-chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.risk-chip.pass{background:var(--ok-bg);color:var(--ok-ink)}\n.risk-chip.warn{background:var(--caution-bg);color:var(--caution-ink)}\n.risk-chip.fail{background:var(--bad-bg);color:var(--bad-ink)}\n.pace-chip{display:inline-flex;font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 9px}\n.pace-chip.on{background:var(--ok-bg);color:var(--ok-ink)}\n.pace-chip.behind{background:var(--caution-bg);color:var(--caution-ink)}\n/* the project: banner across the top of the card, the token art over its lower edge, then name, pills, mint and links, numbers */\n.pp-id{padding:0 0 10px;overflow:hidden;display:flex;flex-direction:column}\n.pp-banner{position:relative;height:148px;overflow:hidden;background:linear-gradient(120deg,#2E63E7,#5B8CFF 55%,#A4C0FF)}\n.pp-banner>.pp-bg{display:block;width:100%;height:100%;object-fit:cover;transition:transfor tyle>\n<style>/* Extracted verbatim from index.html <style> (lines 16-756). One source: index.html should <link> this file instead of carrying the block inline. */\n/* ------------------------------------------------------------------ tokens */\n:root{\n  /* charcoal, the one theme: every page sits on a flat charcoal grey, panels are a step lighter, wells (fields, segmented controls)\n     a step darker, and surfaces get lighter as they come forward. The greys are neutral; blue is the only colour that is not\n     data: fills are the brand blue (#2E63E7, hover #4377F5), lines and accent text a lighter tint of it.\n     --paper is the well, --ink the text, --tile a quiet surface inside a panel, --field a text field. */\n  color-scheme:dark;\n  --bg:#16171A;\n  --paper:#121316; --card:#25272C; --raised:#30333A; --chip:rgba(255,255,255,.06); --mist:rgba(255,255,255,.07); --hover:rgba(255,255,255,.04);\n  --panel:rgba(31,33,37,.18); --panel-solid:#1F2125; --bar:rgba(22,23,26,.8);   /* frosted glass: panels at 18% over the dot field, which shows through the blur; --panel-solid stays opaque for sticky bars, art frames, inputs */\n  --panel-line:rgba(255,255,255,.1); --panel-shadow:none; --frost:blur(26px) saturate(130%);\n  --scrim:rgba(0,0,0,.6);\n  --ink:#F3F4F6; --ink-2:#D3D6DC; --muted:#9DA2AC; --faint:#868B95;\n  --navy:#5B8CFF; --navy-deep:#A4C0FF; --navy-soft:#52668F; --navy-wash:rgba(91,140,255,.15);\n  --solid:#2E63E7; --solid-hover:#4377F5; --accent:#2E63E7; --accent-hover:#4377F5;\n  --pill:rgba(46,99,231,.24); --pill-hover:rgba(46,99,231,.38);   /* the blue tint of the wallet button, also under every chosen segment */\n  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.17); --ring:rgba(91,140,255,.3); --err:#FF8B9C;\n  --warn:#E8B45C; --warn-line:rgba(232,180,92,.36); --warn-bg:rgba(232,180,92,.1); --warn-ink:#F3CB8A; --warn-ink-2:#EBD2A4; --warn-strong:#FFE1B0;\n  /* check results and the chips that carry them: pass, caution, fail */\n  --ok:#45DB93; --ok-ink:#7BE8B2; --ok-bg:rgba(69,219,147,.14); --ok-line:rgba(69,219,147,.3);\n  --caution:#F3BC58; --caution-ink:#F7D08A; --caution-bg:rgba(243,188,88,.14);\n  --bad:#FF7268; --bad-ink:#FF9B93; --bad-bg:rgba(255,114,104,.15);\n  --tile:rgba(255,255,255,.045); --field:#121316;\n  --lift:0 14px 40px -16px rgba(0,0,0,.6);\n  --sh-ind:rgba(0,0,0,.4); --sh-pop:rgba(0,0,0,.6); --sh-sheet:rgba(0,0,0,.65); --sh-toast:rgba(0,0,0,.6);\n  --col-side:clamp(330px,19vw,390px); --col-rail:clamp(370px,21vw,430px);   /* the side columns of a workspace */\n  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;\n  --serif:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;\n  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;\n  --ease-out:cubic-bezier(.22,1,.36,1); --fast:.18s; --dur:.28s;   /* one curve and two lengths for every hover, press, slide and entrance */\n  --ease:var(--ease-out); --out:var(--ease-out); --soft:var(--ease-out);\n  /* how far along a raise is: red, through yellow, to green at the target */\n  --progress:linear-gradient(90deg,#F2554C,#F6C445 50%,#34C17B);\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n/* no native scrollbars, on the page or on any panel. Everything still scrolls by wheel, touch and keyboard. */\n*{scrollbar-width:none}\n*::-webkit-scrollbar{display:none}\nhtml{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}\n@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}\n/* flat charcoal on html (so overscroll on iOS and Mac shows charcoal, not white); body is transparent so the dot field\n   (#bg-dither, fixed, z-index -1, drawn by js/bg-dither.js) shows between the charcoal and the UI. */\nhtml{min-height:100vh;background:var(--bg)}\nbody{min-height:100vh;background:transparent}\n#bg-dither{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\nb,strong{font-weight:500}\nh1,h2,h3,h4{font-weight:500}\nbody{color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}\nbutton,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}\nbutton{cursor:pointer;background:none;border:0}\na{color:inherit;text-decoration:none}\n::selection{background:var(--solid);color:#fff}\n:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}\n\n/* the horizontal lockup: the 21-dot mark in muted blue with the bright blue seed (the same mark an empty column shows),\n   box 1.6 × the wordmark size, wordmark 600 at -3% */\n.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:20px;letter-spacing:-.03em;color:var(--ink)}\n.mark{display:block;color:var(--ink);--seed:var(--navy)}\n.brand .mark{flex:none;width:32px;height:32px;color:var(--navy-soft)}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:500;font-size:12.5px;padding:8px 16px;\n  transition:transform var(--dur) var(--ease-out),background var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out),opacity var(--fast) var(--ease-out);white-space:nowrap}\n.btn:active{transform:scale(.98)}\n.btn-ink{background:var(--solid);color:#fff}\n.btn-ink:hover{background:var(--solid-hover)}\n.btn-navy{background:var(--accent);color:#fff}\n.btn-navy:hover{background:var(--accent-hover)}\n.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}\n.btn-lg{font-size:13.5px;padding:10px 19px}\n.btn-block{width:100%}\n.wdot{width:7px;height:7px;border-radius:50%;background:#7FC8A9;box-shadow:0 0 0 3px rgba(127,200,169,.25)}\n.pop{position:absolute;right:0;top:calc(100% + 10px);width:264px;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--panel-line);box-shadow:0 24px 60px -20px var(--sh-pop);display:none}\n.pop.open{display:block}\n.pop h4{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:10px}\n.pop .bal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}\n.pop .bal span:first-child{color:var(--muted)}\n.pop button{margin-top:12px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--hair-2);font-weight:500;font-size:13px}\n.pop button:hover{background:var(--mist)}\n/* an X account linked to the wallet: optional, shown as a small chip wherever the wallet is named */\n.x-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}\n.x-chip svg{flex:none;width:11px;height:11px;fill:currentColor}\na.x-chip:hover{color:var(--navy-deep)}\n.x-chip em{font-style:normal;font-size:11px;font-weight:400;color:var(--muted);border:1px dashed var(--hair-2);border-radius:999px;padding:0 6px;margin-left:2px}\n.xrow{align-items:center}\n.x-set{display:inline-flex;align-items:center;gap:10px;min-width:0}\n.xrow .linkbtn{margin:0;font-size:13.5px;font-weight:500;color:var(--navy-deep)}\n.pop .xrow .linkbtn,.pop .x-set .linkbtn{width:auto;padding:0;border:0;margin:0}\n.pop .x-link{display:flex;align-items:center;justify-content:center;gap:8px}\n.x-link svg{width:12px;height:12px;fill:currentColor}\n.x-note{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:8px}\n.x-why{margin:14px 0 18px}\n.x-steps{margin:0 0 6px 20px;display:grid;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}\n.x-steps b{color:var(--ink);font-weight:500}\n#xDlg .err{margin-top:10px}\n#walletBtn .wx{display:inline-flex;align-items:center;gap:6px;font-weight:400}\n#walletBtn .wx svg{width:11px;height:11px;fill:currentColor}\n\nh1{line-height:.96;font-weight:400}\nh1 .l1{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(42px,6.6vw,88px);letter-spacing:-.025em}\nh1 .l2{display:block;font-weight:500;font-size:clamp(36px,5.7vw,76px);letter-spacing:-.05em;margin-top:2px}\n/* ---------------------------------------------------------------- sections */\nh2{font-weight:500;font-size:clamp(30px,4.3vw,50px);line-height:1.04;letter-spacing:-.045em}\nh2 i{display:block;font-family:var(--serif);font-weight:400;letter-spacing:-.02em;font-size:1.1em;line-height:1}\n.panel{position:relative;border:1px solid var(--panel-line);border-radius:18px;background:var(--panel);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:var(--panel-shadow)}\n\n/* pressing anything that acts gives a little under the finger */\n:is(.btn,.qb,.chips button,.seg button,.switch,.col-sort,.tabbar a,.steps button):active{transform:scale(.97);transition-duration:.08s}\n:is(.btn,.qb,.chips button,.switch,.col-sort,.steps button){transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out),box-shadow var(--fast) var(--ease-out),opacity var(--fast) var(--ease-out),transform var(--fast) var(--ease-out)}\n/* live numbers roll like an odometer: each digit is a strip of 0 to 9 that slides to the new value */\n.rd{display:inline-block;height:1em;overflow:hidden;vertical-align:baseline}\n.rd-s{display:flex;flex-direction:column;transition:transform .55s var(--ease-out);will-change:transform}\n.rd-s span{display:block;height:1em;line-height:1}\n.rs{display:inline-block;line-height:1}\n/* a loading line shimmers until its data lands */\n.pp-loading{position:relative;overflow:hidden}\n.pp-loading::after{content:\"\";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.6s var(--ease-out) infinite}\n@keyframes shimmer{to{transform:translateX(100%)}}\n/* segmented control: a dark well ter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.nm b .tk{font-family:var(--mono);font-weight:400;font-size:13px;color:var(--muted);margin-left:7px;letter-spacing:-.02em}\n.meta{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);white-space:nowrap}\n.chain{display:inline-flex;align-items:center;gap:6px}\n.chain::before{content:\"\";width:7px;height:7px;background:var(--navy-deep)}\n.chain.sol::before{border-radius:50%;background:var(--navy-soft)}\n.c-prog{display:flex;align-items:center;gap:12px}\n.bar{flex:1;height:6px;border-radius:999px;background:var(--navy-wash);overflow:hidden;container-type:inline-size}\n/* the fill is a window onto a scale as wide as the whole track (100cqw), not a scale squeezed into the fill, so the colour at its\n   tip says how far along the raise is: a third is still red, two thirds is yellow-green, a seeded bar ends in green */\n.bar i{position:relative;overflow:hidden;display:block;height:100%;border-radius:999px;background:var(--progress) left/100% 100% no-repeat;background-size:100cqw 100%;transition:width .6s var(--ease-out)}\n/* three motions. A bar sweeps in from empty the first time its row appears (.fresh, staggered by --i). A live raise carries a slow sheen.\n   A buy landing ticks the row: a quick sheen and the percentage pops. */\n.fresh .bar i{animation:barIn 1.2s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}\n@keyframes barIn{from{width:0}}\n.live .bar i::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*.4s)}\n@keyframes sheen{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}\n.bump .bar i::after{animation:tick .9s ease-out 1}\n@keyframes tick{from{transform:translateX(-100%)}to{transform:translateX(100%)}}\n.bump .pct,.bump [data-dpct]{display:inline-block;animation:pctPop .7s var(--out)}\n@keyframes pctPop{30%{transform:scale(1.22);color:var(--navy-deep)}}\n.refunded .bar i{background:repeating-linear-gradient(135deg,var(--navy-soft) 0 4px,transparent 4px 7px)}\n.pct{font-size:13.5px;color:var(--ink-2);width:40px;text-align:right}\n.c-raised,.c-time{text-align:right;font-size:14.5px}\n.c-raised em{font-style:normal;color:var(--faint)}\n.c-time{color:var(--ink-2)}\n.c-act{text-align:right}\n.pill-sm{display:inline-block;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;border:1px solid var(--hair-2);background:var(--chip);transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out)}\n.row:hover .pill-sm,.pill-sm.hot{background:var(--accent);border-color:var(--accent);color:#fff}\n.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:15px}\n.empty a{color:var(--navy-deep);font-weight:500;border-bottom:1px solid var(--hair-2)}\n\n/* ------------------------------------------------------------- mechanism */\n.tick{position:absolute;width:9px;height:9px;border:0 solid var(--navy);pointer-events:none}\n.tick.tl{top:-1px;left:-1px;border-top-width:1.5px;border-left-width:1.5px}.tick.tr{top:-1px;right:-1px;border-top-width:1.5px;border-right-width:1.5px}\n.tick.bl{bottom:-1px;left:-1px;border-bottom-width:1.5px;border-left-width:1.5px}\n/* .br is also the Terminal's card class, so the bottom-right tick undoes what that rule would give it */\n.tick.br{position:absolute;display:block;bottom:-1px;right:-1px;padding:0;border:0 solid var(--navy);border-bottom-width:1.5px;border-right-width:1.5px;border-radius:0;background:none}\n.plus{position:absolute;width:13px;height:13px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}\n.plus::before,.plus::after{content:\"\";position:absolute;background:var(--navy)}\n.plus::before{left:6px;top:0;width:1.5px;height:13px}.plus::after{top:6px;left:0;height:1.5px;width:13px}\n\n/* ----------------------------------------------------------------- create */\n.create{display:grid;grid-template-columns:1.05fr .95fr}\n.create::before{content:\"\";position:absolute;top:24px;bottom:24px;left:52.5%;width:1px;background:var(--hair)}\n.form{padding:30px;display:grid;gap:18px;grid-template-columns:1fr 1fr}\n.f{display:flex;flex-direction:column;gap:7px;min-width:0}\n.f.full{grid-column:1/-1}\n.f label,.f .lab{font-size:14px;font-weight:500;color:var(--ink-2)}\n.f .hint{font-size:13px;color:var(--faint);font-weight:400;margin-left:6px}\n/* a small \"?\" that explains a field on hover or focus */\n.tip{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid var(--hair-2);font-style:normal;font-size:10.5px;font-weight:500;line-height:1;color:var(--muted);vertical-align:-2px;cursor:help;outline:none;transition:color var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out)}\n.tip:hover,.tip:focus-visible{color:var(--navy-deep);border-color:var(--navy)}\n.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(calc(-50% + var(--tx,0px)),4px);width:max-content;max-width:min(250px,calc(100vw - 24px));padding:8px 11px;border-radius:10px;background:var(--raised);border:1px solid var(--hair-2);box-shadow:0 10px 30px rgba(0,0,0,.35);color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:400;line-height:1.45;text-align:left;white-space:normal;letter-spacing:0;opacity:0;pointer-events:none;z-index:6;transition:opacity var(--fast) var(--ease-out),transform var(--fast) var(--ease-out)}\n.tip:hover::after,.tip:focus-visible::after{opacity:1;transform:translate(calc(-50% + var(--tx,0px)),0)}\n/* the optional limits: a switch in the label, a line while off, the field and its unit while on */\n.lim .lab{display:flex;align-items:center}.lim .lab label{font:inherit;color:inherit}.lim .lab .switch{margin-left:auto}\n.lim-off{font-size:13px;c (--ease-out)}\ndialog[open]::backdrop{animation:fadeIn .32s var(--ease-out)}\n@keyframes sheetIn{0%{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}\n.sheet{background:var(--card);border-radius:22px;border:1px solid var(--panel-line);box-shadow:0 40px 100px -30px var(--sh-sheet);padding:26px;max-height:calc(100dvh - 32px);overflow:auto}\n.sh-head{display:flex;gap:14px;align-items:center}\n.sh-head .nm b{font-size:21px;letter-spacing:-.035em}\n.x{margin-left:auto;flex:none;width:28px;height:28px;border-radius:9px;border:1px solid var(--hair);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted)}\n.x{transition:transform var(--dur) var(--ease-out),background var(--fast) var(--ease-out),color var(--fast) var(--ease-out)}\n.x:hover{background:var(--mist);color:var(--ink);transform:rotate(90deg)}\n.readout{position:relative;border:1px solid var(--hair);margin-top:20px;padding:16px 18px}\n.readout .big{display:flex;justify-content:space-between;align-items:baseline;gap:12px}\n.readout .big b{font-family:var(--mono);font-weight:400;font-size:24px;letter-spacing:-.05em}\n.readout .big b em{font-style:normal;color:var(--faint);font-size:15px}\n.readout .bar{margin:13px 0 12px;height:8px;flex:none}\n.readout .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}\n.amt{margin-top:22px}\n.amt-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}\n.amt-top label{font-weight:500}.amt-top span{color:var(--muted)}\n.amt .inp input{font-family:var(--mono);font-size:24px;letter-spacing:-.05em;padding:13px 16px}\n.amt .inp .suf{font-family:var(--mono);font-size:14px}\n.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}\n.chips button{border:1px solid var(--hair-2);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--ink-2);transition:background var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out)}\n.chips button:hover{background:var(--navy-wash);border-color:var(--navy-soft)}\n.chips button:active{transform:scale(.97)}\n.promise{margin-top:16px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}\n.promise div{display:flex;gap:10px;align-items:flex-start}\n.promise svg{flex:none;width:16px;height:16px;margin-top:3px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.sheet .btn-block{margin-top:20px}\n#walletDlg{width:min(400px,calc(100vw - 24px))}\n#xDlg{width:min(440px,calc(100vw - 24px))}\n#filterDlg{width:min(600px,calc(100vw - 24px))}\n.wlist{display:grid;gap:8px;margin-top:18px}\n.wlist button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 14px;border:1px solid var(--hair-2);border-radius:11px;font-weight:500;font-size:14px;transition:background var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out)}\n.wlist button:hover{background:var(--mist);border-color:var(--navy)}\n.wlist small{font-weight:400;font-size:12.5px;color:var(--muted)}\n.state{margin-top:20px;border-radius:16px;background:var(--mist);padding:16px 18px;font-size:14.5px;color:var(--ink-2)}\n.state b{display:block;font-size:16px;letter-spacing:-.02em;color:var(--ink);margin-bottom:3px}\n.mine{margin-top:14px;display:flex;justify-content:space-between;font-size:13.5px;padding:11px 14px;border-radius:12px;background:var(--navy-wash);color:var(--navy-deep)}\n.specs{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);padding-top:14px;gap:12px}\n.specs dt{font-size:12px;color:var(--faint)}.specs dd{font-size:13px;color:var(--ink-2);margin-top:2px}\n.ca{margin-top:14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair-2);padding:6px 11px;font-family:var(--mono);font-size:12px;color:var(--muted);transition:color var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out)}\n.ca:hover{color:var(--navy-deep);border-color:var(--navy)}\n.ca i{font-style:normal;color:var(--faint)}\n.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}\n.toast{background:var(--raised);color:var(--ink);border:1px solid var(--hair-2);border-radius:12px;padding:11px 20px;font-size:14px;font-weight:400;box-shadow:0 18px 40px -14px var(--sh-toast);animation:toastIn .5s var(--out);text-align:center}\n.toast.out{opacity:0;transform:translateY(8px);transition:opacity var(--fast) var(--ease-out),transform var(--fast) var(--ease-out)}\n@keyframes toastIn{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\n/* ------------------------------------------------------------- responsive */\n@media (max-width:900px){\n  .create{grid-template-columns:1fr}\n  .create::before{display:none}\n  .preview{border-top:1px solid var(--hair)}\n  .plus{display:none}\n  .form{grid-template-columns:1fr}\n}\n@media (max-width:520px){\n  .btn{padding:10px 16px;font-size:13.5px}\n  .btn-lg{padding:13px 20px;font-size:14.5px}\n  .form,.preview,.ppage{padding:22px 18px}\n  .seg button{padding:7px 12px}\n  dialog,#walletDlg,#xDlg,#filterDlg{margin:auto auto 0;width:100vw}\n  .sheet{border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}\n  .specs{grid-template-columns:1fr 1fr}\n}\n@media (prefers-reduced-motion:reduce){\n  dialog[open],.toast{animation-duration:.01s;animation-delay:0s}\n  .rd-s{transition:none}.pp-loading::after{animation:none}\n  .tile.fresh,.fresh .bar i,.live .bar i::after,.bump .bar i::after,.bump .pct,.bump [data-dpct]{animation:none}\n}\n\n/* ================================================================= motion */\n/* Entrances. While body.enter is on, a page's cards rise into place out of a slight blur, one after another down each column\n   and one column after the next, and its title sharpens. Docs sections do the same as they are scrolled to (.rv, then .in).\n   None of it runs for someone who has asked for reduced motion. */\n@keyframes rise{from{transform:translateY(10px)}}   /* no opacity: a frosted card must blur its backdrop from the first frame */\n@keyframes sharpen{from{opacity:0;transform:translateY(6px)}}\n@keyframes swapIn{from{transform:translateY(6px)}}\n@keyframes fadeIn{from{opacity:0}}\n@keyframes draw{to{stroke-dashoffset:0}}\n@keyframes growX{from{transform:scaleX(0)}}\n@keyframes growY{from{transform:scaleY(0)}}\n@keyframes chipUp{0%{opacity:0;transform:translateY(14px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-16px)}}\n@media (prefers-reduced-motion:no-preference){\n  .ws-main,.pp-main,.board{--ec:1}\n  .ws-rail,.pp-rail{--ec:2}\n  :is(.ws-side,.ws-main,.ws-rail,.pp-side,.pp-main,.pp-rail,#pBacker,#pCreator)>:nth-child(2){--en:1}\n  :is(.ws-side,.ws-main,.ws-rail,.pp-side,.pp-main,.pp-rail,#pBacker,#pCreator)>:nth-child(3){--en:2}\n  :is(.ws-side,.ws-main,.ws-rail,.pp-side,.pp-main,.pp-rail,#pBacker,#pCreator)>:nth-child(n+4){--en:3}\n  /* the rise is on the frosted card itself, never on a wrapper around it: Chrome isolates whatever sits under an element\n     whose opacity is animating, and a backdrop-filter inside sees nothing to blur until the animation is gone. So the\n     Portfolio's Backer/Creator wrappers and the .sums grids are skipped and their children rise instead. */\n  body.enter :is(.ws-side,.ws-main,.ws-rail,.pp-side,.pp-main,.pp-rail,#pBacker,#pCreator)>:not(#pBacker,#pCreator,.sums),body.enter .sums>.sum,body.enter .trend,body.enter .board,body.enter .toc,body.enter .doc-hero{\n    animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--ec,0)*60ms + var(--en,0)*45ms)}\n  body.enter :is(.xbar,.filters){animation:swapIn .4s var(--ease-out) both}\n  body.enter :is(.pagehead h1,.pp-name h1,.doc-hero h1 span){animation:sharpen .6s var(--ease-out) .05s both}\n  body.enter .doc-hero h1 .l2{animation-delay:.22s}\n  .docs .rv{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}\n  .docs .rv.in{opacity:1;transform:none}\n  .docs .aside.rv{transition-delay:.09s}\n}\n\n/* ================================================================== views */\n.view[hidden]{display:none}\na.row{color:inherit}\n.bar-link{font-size:14px;font-weight:500;color:var(--navy-deep);border-bottom:1px solid var(--hair-2);padding-bottom:1px}\n.bar-link:hover{border-color:var(--navy-deep)}\n\n/* ================================================================ app bar */\n/* one row: the brand, the sections as plain text links with a soft pill on the open one, and the wallet button as a blue tint */\n.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;height:64px;\n  padding:0 24px;background:var(--bar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}\n.appbar .brand{justify-self:start}\n.appbar>span:empty{display:none}   /* the docs bar has no sections */\n.appbar .tabs{justify-self:start;padding:0;gap:4px;border-color:transparent;background:none}\n.appbar .tabs .seg-ind{display:block;top:0;bottom:0;border-radius:999px;background:var(--pill)}\n.appbar .tabs button{padding:5px 11px;border-radius:999px;font-size:13.5px;font-weight:400;color:var(--muted);transition:color var(--fast) var(--ease-out),background var(--fast) var(--ease-out)}\n.appbar .tabs button:hover{color:var(--ink)}\n.appbar .tabs button[aria-pressed=\"true\"]{color:var(--navy-deep)}\n.appbar .brand small{font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;color:var(--muted);letter-spacing:-.01em;margin-left:2px}\n.appbar .right{justify-self:end;display:flex;align-items:center;gap:16px;position:relative}\n.appbar .btn{height:32px;padding:0 14px;font-size:12.5px;background:var(--pill);color:var(--navy-deep)}\n.appbar .btn:hover{background:var(--pill-hover)}\n.textlink{font-size:14px;font-weight:400;color:var(--navy-deep)}\n.textlink:hover{color:var(--ink)}\n.appbar .textlink{font-size:15px;color:var(--muted)}\n.appbar .textlink:hover{color:var(--ink)}\n/* X, Discord and docs, left of the Docs link: 16px glyphs in ink at 70% */\n.icons{display:flex;align-items:center;gap:14px}\n.ico{display:grid;place-items:center;width:16px;height:16px;color:color-mix(in srgb,var(--ink) 70%,transparent);transition:color var(--fast) var(--ease-out)}\n.ico svg{width:16px;height:16px;fill:currentColor}\n.ico svg.line{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\na.ico:hover{color:var(--ink)}\n.ico.off{opacity:.38;cursor:not-allowed}\n/* every app page is the full width of the window. The board is three columns of raises; the other pages are workspaces (.ws):\n   a side column, the main column and a rail. From 1440px a workspace fills the window and its columns scroll on their own; from\n   1024px the rail is pinned on the right of one scrolling column; below that everything stacks. */\n.appmain{position:relative;z-index:1;padding:20px 24px 16px}\n.appfoot{position:relative;z-index:1;padding:0 26px 16px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n.appfoot button{color:var(--ink-2);border-bottom:1px solid var(--hair-2)}\n#view-app.wide .appfoot{display:none}   /* the board carries its own foot line */\n.ws{display:flex;flex-direction:column;gap:18px;font-size:15px}\n.ws-side,.ws-main,.ws-rail{display:flex;flex-direction:column;gap:18px;min-width:0}\n@media (min-width:1024px) and (max-width:1439px){\n  .ws{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}\n  .ws-side,.ws-main{grid-column:1}\n  .ws-rail{grid-column:2;grid-row:1 / span 2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px) button[aria-selected=\"true\"] .ct{background:var(--solid);color:#fff}\n.col-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;align-content:start;padding:2px 2px 18px}\n.col-empty{grid-column:1 / -1;padding:36px 12px 40px;text-align:center;color:var(--muted);font-size:15px}\n.col-empty .mark{width:48px;height:48px;margin:0 auto 12px;color:var(--navy-soft)}\n.col-empty a{color:var(--navy-deep);font-weight:500;border-bottom:1px solid var(--hair-2)}\n@media (max-width:700px){.col-note{display:none}.feed-head{flex-wrap:wrap}}\n.col-sort{height:28px;padding:0 6px 0 9px;gap:4px;border-radius:8px}\n.col-sort svg{width:12px;height:12px}\n/* A raise as a tile, on the Trending row and in the feed: its art with the fill drawn along the bottom, name, raised\n   amount with a chip for what it is doing, then (in the feed) its time, backers, links and checks, and the button. */\n.tile{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px 10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);transition:border-color var(--fast) var(--ease-out),transform var(--dur) var(--ease-out),background var(--fast) var(--ease-out)}\n.tile:hover{border-color:var(--hair-2);transform:translateY(-2px)}\n.tile .pick::after{border-radius:16px}\n.tile:hover .tr-art img,.tile:hover .tr-art .glyph-art{transform:scale(1.04)}\n.tr-art{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 90% 93%/.95),hsl(calc(var(--h) + 55) 90% 87%/.85));display:grid;place-items:center}\n.tr-card .tr-art{aspect-ratio:4 / 3}\n.tr-art img,.tr-art .glyph-art{width:100%;height:100%;transition:transform .7s var(--ease-out)}\n.tr-art img{object-fit:cover}\n.tr-art .glyph-art{display:grid;place-items:center}\n.tr-art .glyph-art svg{width:40%;height:40%;fill:hsl(calc(var(--h) + 20) 42% 44%)}\n.tr-rank,.tr-pct{position:absolute;top:8px;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:rgba(18,19,22,.72);color:#fff;font-family:var(--mono);font-size:12px;display:grid;place-items:center}\n.tr-rank{left:8px}.tr-pct{right:8px}\n.tr-art .bar{position:absolute;left:8px;right:8px;bottom:8px;height:5px;flex:none;background:rgba(18,19,22,.45)}\n.tr-name{display:flex;align-items:baseline;gap:7px;min-width:0;padding:0 2px;white-space:nowrap}\n.tr-name .pick{display:flex;align-items:baseline;gap:7px;min-width:0}\n.tr-name b{font-size:15px;letter-spacing:-.02em}\n.tr-name .pick span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}\n.tr-name .tag{flex:none;font-size:11px;padding:1px 7px}\n.tr-fig{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;padding:0 2px;min-width:0}\n.tr-fig b{font-size:15px;font-weight:400;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}\n.tr-fig em{font-style:normal;font-size:12px;color:var(--faint)}\n.tr-chg{flex:none;font-size:12px;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--muted);white-space:nowrap}\n.tr-chg.up{background:var(--ok-bg);color:var(--ok-ink)}\n.tr-chg.seeded{background:var(--pill);color:var(--navy-deep)}\n.tr-chg.off{background:var(--chip);color:var(--muted)}\n.tile-meta,.tile-flags{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:0 2px;font-size:13px;color:var(--muted)}\n.tile-flags{gap:6px;position:relative;z-index:1;pointer-events:none}\n.demo-note{margin:0 0 14px;padding:10px 14px;border:1px dashed var(--hair-2);border-radius:12px;color:var(--muted);font-size:13px}\n.demo-chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--hair);letter-spacing:.01em}\n.xv-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px s note on the left, the prototype disclaimer and reset on the right. The columns are\n   sized so this line sits at the foot of the window. */\n.board-foot{display:flex;align-items:baseline;gap:4px 24px;flex-wrap:wrap;margin-top:16px;padding:0 2px;font-size:13px;color:var(--muted)}\n.board-foot #tryHint{flex:1 1 100%}   /* the demo hint takes its own line; the refund note and the disclaimer share the next */\n.board-foot .foot-note{margin-left:auto}\n.board-foot button{color:var(--ink-2);border-bottom:1px solid var(--hair-2);margin-left:6px}\n.board-note{font-size:13px}\n.board-note a{color:var(--navy-deep);font-weight:500;border-bottom:1px solid var(--hair-2)}\n@media (max-width:1000px){.board{min-height:0}.col-list{overflow:visible}}\n@media (max-width:560px){.col-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:8px 8px 10px}.tile .tr-fig b{flex:1 1 auto}.tile .tr-fig em{display:none}}\n/* on a wide window the board fills the window: header, toolbar, columns, then the foot line, with no page scroll. The columns take\n   whatever height is left, so the foot line always sits at the bottom edge. Under 1000px the columns stack and the page scrolls. */\n@media (min-width:1001px){\n  #view-app.wide{display:flex;flex-direction:column;height:100dvh}\n  #view-app.wide .appmain{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}\n  #view-app.wide #tab-terminal{flex:1;min-height:0;display:flex;flex-direction:column}\n  #tab-terminal{width:100%;max-width:1560px;margin:0 auto;padding:0 clamp(8px,2.5vw,48px)}\n  #view-app.wide .board{flex:1;min-height:0}\n  #view-app.wide .trend{flex:none}\n  #view-app.wide .board-foot{flex:none}\n}\n/* the board's toolbar: a search row (search, quick buy, start a raise), then the pair filter, which applies to the whole board */\n.xbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}\n.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}\n.filters .seg{max-width:100%;overflow-x:auto}\n.xbar .mini.search{flex:1 1 320px;height:38px;padding:0 15px;border-radius:11px}\n.xbar .mini.search input{width:100%;font-size:15.5px}\n.xbar .mini.search svg{width:17px;height:17px}\n.xbar .btn{height:38px;border-radius:11px;padding:0 16px;font-size:13.5px}\n\n.br.flash{animation:flash 1.8s ease-out}\n.tile.fresh{animation:cardIn .4s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*35ms)}\n@keyframes cardIn{from{transform:translateY(8px)}}\n.pick::after{content:\"\";position:absolute;inset:0;border-radius:18px}\n.pick:focus-visible{outline:none}.pick:focus-visible::after{outline:2px solid var(--navy);outline-offset:2px}\n.t-act{text-align:right;position:relative;z-index:1}\n.qb{border:1px solid var(--hair-2);background:var(--chip);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;white-space:nowrap;transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out),transform var(--fast) var(--ease-out)}\n.qb:hover,.qb.hot{background:var(--accent);border-color:var(--accent);color:#fff}\n.qb:active{transform:scale(.97)}\n.qb[disabled]{opacity:.5;cursor:wait}\n.qb .num{font-weight:400}\n\n/* a raise's own page. Every list opens it in a new browser tab, so the list stays where it was. Stacked on a phone; on a wide screen\n   the raise sits on the left (readout, chart, recent buys) and the buy on the right (amount, terms, facts). */\n.back{display:inline-block;margin:4px 0 14px}\n.ppage{padding:30px 32px}\n.ppage .sh-head .nm b{font-size:26px}\n.ppage .btn-block{margin-top:20px}\n@media (min-width:900px){\n  .dcols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:0 40px;align-items:start}\n  .dcols .d-buy{grid-column:2;grid-row:1 / span 2}\n  .dcols .d-buy>:first-child{margin-top:20px}\n  .dcols .d-acts{grid-column:1}\n  .ppage .specs{grid-template-columns:1fr;gap:0;padding-top:6px}\n  .ppage .specs div{display:flex;justify-content:spac
