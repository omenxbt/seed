t>Head<\u002Fdt><dd>13px --faint<\u002Fdd><\u002Fdiv><div><dt>Row<\u002Fdt><dd>11px 18px · --hair<\u002Fdd><\u002Fdiv><div><dt>Hover<\u002Fdt><dd data-token=\"--hover\"><\u002Fdd><\u002Fdiv><div><dt>Strip<\u002Fdt><dd>2px bars, 5px pitch<\u002Fdd><\u002Fdiv><\u002Fdl>\n    <h3>Toast<\u002Fh3>\n    <dl class=\"kv\"><div><dt>Ground<\u002Fdt><dd data-token=\"--raised\"><\u002Fdd><\u002Fdiv><div><dt>Border<\u002Fdt><dd data-token=\"--hair-2\"><\u002Fdd><\u002Fdiv><div><dt>Radius<\u002Fdt><dd>12px<\u002Fdd><\u002Fdiv><div><dt>Text<\u002Fdt><dd>14px<\u002Fdd><\u002Fdiv><div><dt>Position<\u002Fdt><dd>22px from the foot<\u002Fdd><\u002Fdiv><\u002Fdl>\n  <\u002Faside>\n<\u002Fsection>\n\n<!-- ============================================================ VOICE -->\n<section class=\"doc-sec\" id=\"voice\">\n  <div class=\"prose\">\n    <h2><i>Voice,<\u002Fi> plain words and real numbers<\u002Fh2>\n    <p>Seed writes the way its docs read: short sentences, plain words, the number instead of the adjective. It says what happens, not what it means for you. A founder's choices are shown as facts, never as warnings. It does not sell. It does not use \"revolutionary\", \"seamless\" or \"unlock\" as a verb of promise; \"unlock\" is only ever the thing team tokens do on a schedule. No em dashes: a comma, a colon or a full stop does the work.<\u002Fp>\n    <h3 style=\"font-size:16px;font-weight:500;margin:22px 0 8px\">The rules<\u002Fh3>\n    <ol>\n      <li><b>Say the number.<\u002Fb> \"Put 2 SOL into a raise and you pay 2.02 SOL\", not \"a small fee\".<\u002Fli>\n      <li><b>Say what happens.<\u002Fb> \"If it misses, every wallet gets back exactly what it paid\", not \"your funds are protected\".<\u002Fli>\n      <li><b>Facts, not warnings.<\u002Fb> Team share, unlocks, roadmap and token use are shown as given. The only graded things are on-chain checks.<\u002Fli>\n      <li><b>One idea a sentence.<\u002Fb> If a sentence needs an em dash, it is two sentences.<\u002Fli>\n      <li><b>Sentence case everywhere.<\u002Fb> Buttons, tabs, headings, chips. Proper nouns keep their case: Solana, Meteora, SOL, USDC.<\u002Fli>\n      <li><b>The vocabulary.<\u002Fb> A raise, not a presale or a sale. A backer, not an investor. A founder, not a creator or a dev. The pair asset. The target. The deadline. Live, filled, seeded, refunded. The pool. Team unlocks.<\u002Fli>\n      <li><b>Figures in mono.<\u002Fb> Amounts carry their unit: 81 SOL, $100,000, 1,000,000,000, 1.25%, 24 hours to 14 days.<\u002Fli>\n    <\u002Fol>\n    <h3 style=\"font-size:16px;font-weight:500;margin:22px 0 8px\">From the site<\u002Fh3>\n    <div class=\"bb-two\">\n      <div class=\"bb-do\">Miss it and every wallet is refunded, fee included.<small>Terminal hero<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Our revolutionary refund guarantee unlocks risk-free backing.<small>Promises a feeling; names nothing<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-do\">Put 2 SOL into a raise and you pay 2.02 SOL.<small>Docs, the two fees<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Low fees, built for the community.<small>No number<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-do\">There is no treasury, no vault and no reserve. The money raised goes into the pool and nowhere else, so there is nothing to rug.<small>Docs, overview<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Fully decentralized, trustless and secure by design.<small>Adjectives standing in for facts<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-do\">Backers see it as it is: a fact, not a warning.<small>Launch form, team share<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Warning: high team allocation. Proceed with caution.<small>Styles a founder's choice as danger<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-do\">Live on Solana devnet: real transactions, test SOL with no value, and a day counts as a minute.<small>Board foot<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Beta: use at your own risk.<small>Says nothing about what is different<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-do\">The buy that completes the target is trimmed to what fits. If 3.4 SOL of room is left and you send 10 SOL, the program takes what fills it and the rest never leaves your wallet.<small>Docs, lifecycle<\u002Fsmall><\u002Fdiv>\n      <div class=\"bb-dont\">Smart overflow protection seamlessly handles edge cases.<small>Jargon in place of the mechanism<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n    <h3 style=\"font-size:16px;font-weight:500;margin:26px 0 8px\">What Seed is<\u002Fh3>\n    <p><b>One sentence.<\u002Fb> Seed is a terminal for fixed-price raises on Solana: back an idea at one price, and if the raise misses its target by the deadline, every wallet gets back what it paid.<\u002Fp>\n    <p><b>One paragraph.<\u002Fb> A founder sets a target, from 81 SOL to $100,000, a deadline of one to fourteen days, and the asset the raise is paired with, SOL or USDC. Backers buy in at one fixed price, plus a 1% fee on top. If the target is met, Seed's program mints the 1,000,000,000 supply, puts the whole raise and the pool's share of the tokens into a Meteora pool at the raise price, and locks that liquidity for good. Backers claim their tokens at once. If the deadline passes first, nothing is minted and every backer takes back what they paid, fee included. There is no treasury and no reserve: the money goes into the pool and nowhere else. The market decides what gets funded; Seed does not judge ideas or founder terms.<\u002Fp>\n    <p class=\"bb-script\"><b>Thirty seconds, spoken.<\u002Fb> Most launches ask you to trust a founder with your money. Seed asks you to back an idea at one fixed price. A founder sets a target and a deadline. You buy in with SOL or USDC. If the target is met, the whole raise opens a Meteora pool, locked for good, and your tokens are yours the same day. If it misses, every wallet gets back exactly what it paid, fee included. Nothing is minted, nothing is held back. Seeded in full, or refunded in full. That is Seed.<\u002Fp>\n  <\u002Fdiv>\n  <aside class=\"aside\">\n    <h3>Never<\u002Fh3>\n    <div class=\"where\">revolutionary · seamless · unlock (as a promise) · game-changing · trustless · community-driven · safe · guaranteed returns · 🚀 · em dashes · exclamation marks · title case · \"users\"<\u002Fdiv>\n    <h3>Always<\u002Fh3>\n    <div class=\"where\">raise · backer · founder · target · deadline · pair asset · live, filled, seeded, refunded · the pool · fee included · what it paid · locked for good<\u002Fdiv>\n    <h3>Numbers the copy leans on<\u002Fh3>\n    <dl class=\"kv\"><div><dt>Fee<\u002Fdt><dd>1% on top<\u002Fdd><\u002Fdiv><div><dt>Target<\u002Fdt><dd>81 SOL to $100,000<\u002Fdd><\u002Fdiv><div><dt>Deadline<\u002Fdt><dd>24h to 14 days<\u002Fdd><\u002Fdiv><div><dt>Supply<\u002Fdt><dd>1,000,000,000<\u002Fdd><\u002Fdiv><div><dt>Pool fee<\u002Fdt><dd>1.25%, 70/30<\u002Fdd><\u002Fdiv><div><dt>Refund<\u002Fdt><dd>100%<\u002Fdd><\u002Fdiv><div><dt>Seeding<\u002Fdt><dd>4 steps, 3 days<\u002Fdd><\u002Fdiv><div><dt>Last unlock<\u002Fdt><dd>≥ 90 days<\u002Fdd><\u002Fdiv><\u002Fdl>\n  <\u002Faside>\n<\u002Fsection>\n\n<!-- ============================================================ CONTENT & VIDEO -->\n<section class=\"doc-sec\" id=\"content\">\n  <div class=\"prose\">\n    <h2><i>Content and video,<\u002Fi> the kit<\u002Fh2>\n    <p>Everything a post or a cut needs is in <code class=\"num\">brand/kit/<\u002Fcode>, built from the same tokens as this page. Social templates are HTML files that render to PNG; the video pieces are a Remotion project in <code class=\"num\">brand/video/<\u002Fcode> that imports <code class=\"num\">kit/tokens/tokens.json<\u002Fcode> and the three fonts, so a token change re-renders every cut.<\u002Fp>\n    <h3 style=\"font-size:16px;font-weight:500;margin:22px 0 8px\">Social templates<\u002Fh3>\n    <p>Five templates at five sizes. Dark charcoal ground, the static dot field low and to the right, the mark top left, the figure in mono, the URL in the foot. One idea a card. Copy follows the voice rules above; the raise spotlight reads its figures from a raise, so the numbers are never typed.<\u002Fp>\n    <div class=\"bb-files\" id=\"socialFiles\"><\u002Fdiv>\n    <h3 style=\"font-size:16px;font-weight:500;margin:26px 0 8px\">Video pieces<\u002Fh3>\n    <div class=\"bb-vid\">\n      <div><b>Logo sting · 3s<\u002Fb>The 21 dots arrive on the spiral one by one, 40ms apart, with the ease-out curve; the seed lands last and brightens. Wordmark fades in at 1.6s. <code>LogoSting<\u002Fcode><\u002Fdiv>\n      <div><b>Title card<\u002Fb>Serif italic first line, sans 500 second line, as the hero. Sharpens in over .6s like <code>sharpen<\u002Fcode>. <code>TitleCard<\u002Fcode><\u002Fdiv>\n      <div><b>Lower third<\u002Fb>A frosted panel rises 10px in .5s. Name in 500, role in muted, the mark at 32px. <code>LowerThird<\u002Fcode><\u002Fdiv>\n      <div><b>Stat callout<\u002Fb>One figure in mono rolling like the site's odometer, its label under it in muted. <code>StatCallout<\u002Fcode><\u002Fdiv>\n      <div><b>Raise filling<\u002Fb>The fill bar sweeps red through yellow to green over the whole track while the counter climbs to the target. <code>RaiseFill<\u002Fcode><\u002Fdiv>\n      <div><b>Chart reveal<\u002Fb>The raise line draws itself in 1.7s, the area fades in at 1.1s, the tip at 1.8s, as on the raise page. <code>ChartReveal<\u002Fcode><\u002Fdiv>\n      <div><b>End card<\u002Fb>Mark, wordmark and the URL, the dot field drifting behind. <code>EndCard<\u002Fcode><\u002Fdiv>\n      <div><b>Screen frame<\u002Fb>A UI recording inside a 16px-radius panel with the panel line, over the dot field, with the lower-third slot kept clear. <code>ScreenFrame<\u002Fcode><\u002Fdiv>\n    <\u002Fdiv>\n    <h3 style=\"font-size:16px;font-weight:500;margin:26px 0 8px\">Captions and safe zones<\u002Fh3>\n    <table class=\"dtable\"><thead><tr><th>Format<\u002Fth><th>Safe zone<\u002Fth><th>Caption<\u002Fth><th>Lower third<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      <tr><td><code>1920 × 1080<\u002Fcode> 16:9<\u002Ftd><td>96px in from every edge<\u002Ftd><td>Instrument Sans 500, 48px on 1.3, --ink on a --bar pill, 20px 28px padding, two lines at most, bottom 144px<\u002Ftd><td>Bottom left, 96px in, 300px wide at least<\u002Ftd><\u002Ftr>\n      <tr><td><code>1080 × 1920<\u002Fcode> 9:16<\u002Ftd><td>120px sides; 250px top and 320px bottom clear of platform UI<\u002Ftd><td>56px on 1.3, centred, three lines at most, foot at 420px<\u002Ftd><td>Bottom left at 420px from the foot<\u002Ftd><\u002Ftr>\n      <tr><td><code>1080 × 1080<\u002Fcode> 1:1<\u002Ftd><td>80px in from every edge<\u002Ftd><td>48px on 1.3, two lines, bottom 120px<\u002Ftd><td>Bottom left, 80px in<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n    <p style=\"margin-top:14px\">Captions are set in sentence case, one clause a line, figures in IBM Plex Mono. The mark stays top left in every format with its clear space. Nothing goes under the platform's own controls. Every piece renders at all three formats from the same composition; the Remotion root lists them.<\u002Fp>\n  <\u002Fdiv>\n  <aside class=\"aside\">\n    <h3>Kit<\u002Fh3>\n    <div class=\"where\"><code class=\"num\">kit/logo/<\u002Fcode> SVG and PNG<br><code class=\"num\">kit/tokens/<\u002Fcode> tokens.json, tokens.css, tokens.figma.json, seed.ase, seed.gpl<br><code class=\"num\">kit/social/<\u002Fcode> templates and renders<br><code class=\"num\">kit/screenshots/<\u002Fcode> clean captures<br><code class=\"num\">video/<\u002Fcode> the Remotion project<br><code class=\"num\">video/preview.html<\u002Fcode> each piece as an HTML preview<\u002Fdiv>\n    <h3>Render sizes<\u002Fh3>\n    <dl class=\"kv\"><div><dt>Post<\u002Fdt><dd>1080 × 1080<\u002Fdd><\u002Fdiv><div><dt>Portrait<\u002Fdt><dd>1080 × 1350<\u002Fdd><\u002Fdiv><div><dt>Story<\u002Fdt><dd>1080 × 1920<\u002Fdd><\u002Fdiv><div><dt>Link card<\u002Fdt><dd>1200 × 675<\u002Fdd><\u002Fdiv><div><dt>X header<\u002Fdt><dd>1500 × 500<\u002Fdd><\u002Fdiv><div><dt>Video<\u002Fdt><dd>1920 × 1080 · 1080 × 1920 · 1080 × 1080<\u002Fdd><\u002Fdiv><\u002Fdl>\n    <h3>Fonts in video<\u002Fh3>\n    <div class=\"where\">The three families from <code class=\"num\">brand/fonts/<\u002Fcode>, loaded with Remotion's <code class=\"num\">@remotion/fonts<\u002Fcode>. Never a substitute weight: Sans 400 and 500, Serif 400 italic, Mono 400 and 500.<\u002Fdiv>\n  <\u002Faside>\n<\u002Fsection>\n\n<section class=\"doc-sec\" id=\"files\">\n  <div class=\"prose\">\n    <h2><i>Files,<\u002Fi> and how this page stays true<\u002Fh2>\n    <p>The tokens live in <code class=\"num\">css/tokens.css<\u002Fcode>, a verbatim extract of the <code class=\"num\">:root<\u002Fcode> blocks in <code class=\"num\">index.html<\u002Fcode> and <code class=\"num\">css/delta.css<\u002Fcode>. The site should link that file in place of the inline block, so there is exactly one copy. This page links the same stylesheets as the site and reads every value from them at load; the swatches, the type specs, the keyframes, the spacing histogram and the background config are all computed, not typed. <code class=\"num\">kit/tokens/tokens.json<\u002Fcode> is generated from the same file by <code class=\"num\">brand/_build/extract-tokens.mjs<\u002Fcode>.<\u002Fp>\n    <p>Where an earlier brand book or spec disagrees with the code, the code wins; each case is in <code class=\"num\">brand/CONFLICTS.md<\u002Fcode> for a decision.<\u002Fp>\n  <\u002Fdiv>\n  <aside class=\"aside\"><h3>Read at load<\u002Fh3><dl class=\"kv\"><div><dt>Tokens<\u002Fdt><dd id=\"nTokens\">…<\u002Fdd><\u002Fdiv><div><dt>Keyframes<\u002Fdt><dd id=\"nKf\">…<\u002Fdd><\u002Fdiv><div><dt>Animations<\u002Fdt><dd id=\"nAnim\">…<\u002Fdd><\u002Fdiv><div><dt>Transitions<\u002Fdt><dd id=\"nTrans\">…<\u002Fdd><\u002Fdiv><div><dt>Breakpoints<\u002Fdt><dd id=\"nBreak\">…<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Faside>\n<\u002Fsection>\n<p class=\"bb-foot\">Seed brand · built from <code>css/tokens.css<\u002Fcode>, <code>css/base.css<\u002Fcode>, <code>css/presale.css<\u002Fcode>, <code>css/delta.css<\u002Fcode> and <code>js/bg-dither.js<\u002Fcode> · brand/CONFLICTS.md<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"toasts\" id=\"toasts\" aria-live=\"polite\"><\u002Fdiv>\n\n<script>\n(function(){\n  'use strict';\n  const cs = getComputedStyle(document.documentElement);\n  const token = n => cs.getPropertyValue(n).trim();\n  function parse(v){ v=v.trim(); let m;\n    if((m=v.match(/^#([0-9a-f]{6})$/i))){ const n=parseInt(m[1],16); return {r:n>>16&255,g:n>>8&255,b:n&255,a:1}; }\n    if((m=v.match(/^#([0-9a-f]{3})$/i))) return {r:parseInt(m[1][0]+m[1][0],16),g:parseInt(m[1][1]+m[1][1],16),b:parseInt(m[1][2]+m[1][2],16),a:1};\n    if((m=v.match(/^rgba?\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*(\\d+)\\s*(?:,\\s*([\\d.]+))?\\s*\\)$/))) return {r:+m[1],g:+m[2],b:+m[3],a:m[4]===undefined?1:+m[4]};\n    return null; }\n  const h2=n=>n.toString(16).padStart(2,'0').toUpperCase();\n  const hex=c=>'#'+h2(c.r)+h2(c.g)+h2(c.b)+(c.a<1?h2(Math.round(c.a*255)):'');\n  const rgb=c=>c.a<1?`rgba(${c.r}, ${c.g}, ${c.b}, ${c.a})`:`rgb(${c.r}, ${c.g}, ${c.b})`;\n  function hsl(c){ const r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2; if(mx!==mn){const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;} h/=6;} return `hsl(${Math.round(h*360)} ${Math.round(s*100)}% ${Math.round(l*100)}%${c.a<1?' / '+c.a:''})`; }\n  const BG=parse(token('--bg'))||{r:22,g:23,b:26,a:1};\n  const flat=c=>({r:Math.round(c.r*c.a+BG.r*(1-c.a)),g:Math.round(c.g*c.a+BG.g*(1-c.a)),b:Math.round(c.b*c.a+BG.b*(1-c.a)),a:1});\n\n  /* every element that names a token shows its value */\n  document.querySelectorAll('[data-token]').forEach(el=>{ let v=token(el.dataset.token); if(el.hasAttribute('data-first')) v=v.split(',')[0].replace(/'/g,''); const c=parse(v); el.textContent = (c && !el.hasAttribute('data-raw')) ? hex(c) : v; });\n\n  /* swatches, by role */\n  const GROUPS=[\n    ['Background layers',[['--bg','The page'],['--paper','Wells: inputs, seg tracks, chart grounds'],['--well','Delta wells: inputs, search, stat cells'],['--field','Form fields']]],\n    ['Surfaces',[['--panel','Frosted panel, 18% over the field'],['--panel-solid','Opaque panel: bars, art frames, tables'],['--bar','App bar and icon rail'],['--card','Popovers, menus, sheets'],['--raised','Toasts, tooltips, chart tags, switch track'],['--tile','Quiet tile inside a panel'],['--chip','Chips, tags, ghost and icon buttons'],['--mist','Hover fill on soft buttons'],['--hover','Row hover']]],\n    ['Borders and rings',[['--panel-line','Panel outline'],['--hair','Hairline dividers, input borders'],['--hair-2','Chips, tags, toasts, copy buttons'],['--seg-line','Chosen segment'],['--ring','Focus ring'],['--scrim','Dialog backdrop']]],\n    ['Text',[['--ink','Primary text'],['--ink-2','Secondary, body in prose'],['--muted','Labels, captions, idle tabs'],['--faint','Hints, table heads, timestamps']]],\n    ['Blue',[['--solid','Brand blue: selection, switch on, badges, gradient foot, favicon seed'],['--solid-hover','Hover of solid'],['--navy','Lines: focus, tab indicator, chart line, nav seed'],['--navy-deep','Accent text: links, active tabs, strips'],['--navy-soft','Muted: nav dots, dashed lines, volume'],['--navy-wash','Tint: bar tracks, avatars, code'],['--pill','Wallet button, chosen segment'],['--pill-hover','Hover of pill']]],\n    ['Success',[['--ok','Pass stroke, buy button, seeded strips'],['--ok-ink','Pass text, up moves'],['--ok-bg','Pass fill'],['--ok-line','Live pill border']]],\n    ['Caution and warning',[['--caution','Caution stroke, time running out'],['--caution-ink','Caution text'],['--caution-bg','Caution fill'],['--warn','Unverified ring'],['--warn-ink','Warning text'],['--warn-ink-2','Warning body'],['--warn-strong','Warning emphasis'],['--warn-line','Warning border'],['--warn-bg','Warning fill']]],\n    ['Danger',[['--bad','Fail stroke, sell button'],['--bad-ink','Fail text, down moves'],['--bad-bg','Fail fill'],['--err','Form errors']]],\n    ['Shadow colours',[['--sh-pop','Popover: 0 24px 60px -20px'],['--sh-sheet','Sheet: 0 40px 100px -30px'],['--sh-toast','Toast: 0 18px 40px -14px'],['--sh-ind','Indicator']]]\n  ];\n  const sw=document.getElementById('swatches'); let nTok=0;\n  GROUPS.forEach(([g,list])=>{ const wrap=document.createElement('div'); wrap.innerHTML=`<h3 style=\"font-size:16px;font-weight:500;margin-bottom:10px\">${g}<\u002Fh3><div class=\"bb-grid\"><\u002Fdiv>`; const grid=wrap.lastElementChild;\n    list.forEach(([n,u])=>{ const v=token(n); if(!v) return; const c=parse(v); if(!c) return; nTok++; const f=c.a<1?flat(c):null; const d=document.createElement('div'); d.className='bb-sw';\n      d.innerHTML=`<div class=\"c ${c.a<1?'alpha':''}\"><i style=\"background:${v}\"><\u002Fi><\u002Fdiv><div class=\"t\"><b>${n}<\u002Fb><code>${hex(c)}<\u002Fcode><code>${rgb(c)}<\u002Fcode><code>${hsl(c)}<\u002Fcode>${f?`<code>on bg ${hex(f)}<\u002Fcode>`:''}<span class=\"u\">${u}<\u002Fspan><\u002Fdiv>`; grid.appendChild(d); });\n    sw.appendChild(wrap); });\n  document.getElementById('nTokens').textContent = nTok + ' colours';\n  document.getElementById('bbCount').textContent = `${nTok} colour tokens, read at ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}.`;\n  /* gradients */\n  const gr=document.getElementById('grads');\n  [['--progress','The fill bar, across 100cqw'],['--grad-btn','Primary button, 180°'],['--grad-seg','Chosen segment, rank badge']].forEach(([n,u])=>{ const v=token(n); const d=document.createElement('div'); d.className='bb-sw'; d.innerHTML=`<div class=\"c\" style=\"background:${v}\"><\u002Fdiv><div class=\"t\"><b>${n}<\u002Fb><code style=\"white-space:normal\">${v}<\u002Fcode><span class=\"u\">${u}<\u002Fspan><\u002Fdiv>`; gr.appendChild(d); });\n  /* chart colours (js/presale-page.js) */\n  const cc=document.getElementById('chartCols');\n  [['#2FBF7A','CANDLE_UP','Candle up, PnL tag'],['#F0554B','CANDLE_DN','Candle down'],['#2E63E7','KIND_COL.presale','Donut: backers'],['#8FB4FF','KIND_COL.lp','Donut: pool'],['#D9DCE2','KIND_COL.team','Donut: team'],['#565B66','KIND_COL.other','Donut: other'],['#10151A','tag ink','Text on a coloured price tag']].forEach(([v,n,u])=>{ const c=parse(v); const d=document.createElement('div'); d.className='bb-sw'; d.innerHTML=`<div class=\"c\" style=\"background:${v}\"><\u002Fdiv><div class=\"t\"><b>${n}<\u002Fb><code>${hex(c)}<\u002Fcode><code>${rgb(c)}<\u002Fcode><code>${hsl(c)}<\u002Fcode><span class=\"u\">${u}<\u002Fspan><\u002Fdiv>`; cc.appendChild(d); });\n\n  /* type scale: real markup, specs read from the rendered element */\n  const TYPE=[\n    ['Display','h1 .l1 + .l2','<h1 style=\"font-size:16px\"><span class=\"l1\">Back the idea,<\u002Fspan><span class=\"l2\">at one fixed price.<\u002Fspan><\u002Fh1>','clamp(42px,6.6vw,88px) · clamp(36px,5.7vw,76px)', ['.l1','.l2']],\n    ['Docs hero','.doc-hero h1','<div class=\"doc-hero\" style=\"padding:0;border:0;background:none;backdrop-filter:none;box-shadow:none\"><h1><span class=\"l1\">How Seed works,<\u002Fspan><span class=\"l2\">in plain terms<\u002Fspan><\u002Fh1><\u002Fdiv>','clamp(34px,4.2vw,54px) · 1.08em / 1em', ['.l1','.l2']],\n    ['Hero title','.hero h1','<div class=\"hero\" style=\"padding:0;min-height:0;border:0;background:none;backdrop-filter:none;box-shadow:none\"><h1><i>Back the idea,<\u002Fi> at one fixed price.<\u002Fh1><\u002Fdiv>','clamp(26px,2.4vw,34px)', ['h1']],\n    ['Page head','.pagehead h1','<div class=\"pagehead\" style=\"padding:0\"><h1><i>Your<\u002Fi> portfolio<\u002Fh1><\u002Fdiv>','', ['h1']],\n    ['Raise name','.pp-name h1','<div class=\"pp-name\" style=\"padding:0;margin:0\"><h1>Osprey<\u002Fh1><span class=\"pp-tk\">OSPR<\u002Fspan><\u002Fdiv>','', ['h1']],\n    ['Section','.doc-sec h2','<div class=\"doc-sec\" style=\"display:block\"><h2 style=\"margin:0\">The two fees<\u002Fh2><\u002Fdiv>','', ['h2']],\n    ['Card title','.card-h','<div class=\"card-h\" style=\"padding:0\">Performance<\u002Fdiv>','', [null]],\n    ['Tab title','.tab-h h2','<div class=\"pp\"><div class=\"tab-h\" style=\"margin:0\"><h2>Team tokens<\u002Fh2><\u002Fdiv><\u002Fdiv>','', ['h2']],\n    ['Body','body','<p>Backers buy in with that asset at one fixed price, plus a 1% fee on top.<\u002Fp>','', [null]],\n    ['Prose','.prose p','<div class=\"prose\" style=\"padding:0;border:0;background:none;backdrop-filter:none;box-shadow:none\"><p style=\"margin:0\">If the target is met, Seed\\u2019s program mints the 1,000,000,000 supply.<\u002Fp><\u002Fdiv>','', ['p']],\n    ['Markdown','.md','<div class=\"pp\"><div class=\"md\"><p style=\"margin:0\">Alerts are paid for in $OSPR. Holders get the first 50 alerts a month free.<\u002Fp><\u002Fdiv><\u002Fdiv>','', ['.md']],\n    ['Label','.rail-lab','<div class=\"rail-card\" style=\"padding:0;border:0\"><span class=\"rail-lab\" style=\"margin:0\">Amount<\u002Fspan><\u002Fdiv>','', [null]],\n    ['Caption','.quiet','<span class=\"quiet\">Demo data<\u002Fspan>','', [null]],\n    ['Overline','.steps-h','<div class=\"steps-h\" style=\"padding:0;border:0\">Optional<\u002Fdiv>','', [null]],\n    ['Figure, large','.pp .readout .big b','<div class=\"pp\"><div class=\"readout\"><div class=\"big\"><b>52.70 <em>SOL<\u002Fem><\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fdiv>','', ['b']],\n    ['Figure','.readout .big b','<div class=\"readout\" style=\"margin:0;padding:0;border:0\"><div class=\"big\"><b>52.70 <em>SOL<\u002Fem><\u002Fb><\u002Fdiv><\u002Fdiv>','', ['b']],\n    ['Stat','#pstats .sum dd','<div id=\"pstats\" style=\"display:block;border:0;background:none\"><div class=\"sum\" style=\"padding:0;background:none\"><dt>Open positions<\u002Fdt><dd class=\"num\">4<\u002Fdd><\u002Fdiv><\u002Fdiv>','', ['dd']],\n    ['Amount input','.amt .inp input','<div class=\"amt\" style=\"margin:0\"><div class=\"inp\"><input value=\"2.00\" aria-label=\"Amount\"><span class=\"suf\">SOL<\u002Fspan><\u002Fdiv><\u002Fdiv>','', ['input']],\n    ['Number','.num','<span class=\"num\">0.000000222 SOL<\u002Fspan>','', [null]],\n    ['Mono small','.mono','<span class=\"mono\">So111…11112<\u002Fspan>','', [null]],\n    ['Equation','.eq','<div class=\"eq\" style=\"padding:0\">price = target ÷ backers\\u2019 tokens<\u002Fdiv>','', [null]],\n    ['Wordmark','.brand','<span class=\"brand\">Seed<\u002Fspan>','', [null]],\n    ['Button','.btn','<a class=\"btn btn-ink\" href=\"#type\">Start a raise<\u002Fa>','', [null]],\n    ['Chip','.risk-chip','<span class=\"risk-chip pass\">Mint revoked<\u002Fspan>','', [null]],\n    ['Table head','.dtable th','<table class=\"dtable\" style=\"margin:0;width:auto\"><thead><tr><th style=\"border:0;padding:0\">Market cap<\u002Fth><\u002Ftr><\u002Fthead><\u002Ftable>','', ['th']],\n  ];\n  const ts=document.getElementById('typeScale');\n  TYPE.forEach(([name,sel,html,src,targets])=>{ const row=document.createElement('div'); row.innerHTML=`<div class=\"n\"><b>${name}<\u002Fb>${sel}<\u002Fdiv><div class=\"s\">${html}<\u002Fdiv><div class=\"bb-spec\"><\u002Fdiv>`; ts.appendChild(row);\n    const spec=row.querySelector('.bb-spec'); const root=row.querySelector('.s');\n    const lines=targets.map(t=>{ const el=t?root.querySelector(t):root.firstElementChild; if(!el) return ''; const c=getComputedStyle(el); const fam=c.fontFamily.split(',')[0].replace(/['\"]/g,''); const ls=parseFloat(c.letterSpacing)||0, fs=parseFloat(c.fontSize); const lh=c.lineHeight==='normal'?'normal':(parseFloat(c.lineHeight)/fs).toFixed(2); return `<b>${fam}<\u002Fb> ${c.fontWeight}${c.fontStyle==='italic'?' italic':''} · ${fs}px / ${lh} · ${ls?(ls/fs).toFixed(3).replace(/0+$/,'')+'em':'0'}`; });\n    spec.innerHTML = lines.filter(Boolean).join('<br>') + (src?`<br><span style=\"color:var(--faint)\">${src}<\u002Fspan>`:''); });\n\n  /* stylesheet scans: keyframes, animation and transition declarations, spacing, radii, shadows, breakpoints */\n  const sheets=[...document.styleSheets].filter(s=>{ try{ return s.cssRules && /css\\/(base|presale|delta|tokens)\\.css/.test(s.href||''); }catch(e){ return false; } });\n  const kf=[], anims=[], trans=[], space={}, radii={}, shadows={}, breaks=new Set();\n  function walk(rules, media){ for(const r of rules){ if(r.type===CSSRule.KEYFRAMES_RULE){ kf.push([r.name,[...r.cssRules].map(k=>k.keyText+'{'+k.style.cssText+'}').join(' ')]); }\n    else if(r.type===CSSRule.MEDIA_RULE){ breaks.add(r.conditionText||r.media.mediaText); walk(r.cssRules, r.conditionText); }\n    else if(r.type===CSSRule.SUPPORTS_RULE||r.type===CSSRule.CONTAINER_RULE||(r.cssRules&&r.selectorText===undefined&&r.type!==CSSRule.KEYFRAMES_RULE)){ if(r.cssRules) walk(r.cssRules, media); if(r.type===12&&r.conditionText) breaks.add('@container '+r.conditionText); }\n    else if(r.style){ const st=r.style, a=st.getPropertyValue('animation')||(st.animationName&&st.animationName!=='none'?[st.animationName,st.animationDuration,st.animationTimingFunction,st.animationDelay].join(' '):''); if(a&&a!=='none') anims.push([r.selectorText,a,media]);\n      const t=st.getPropertyValue('transition'); if(t) trans.push([r.selectorText,t,media]);\n      for(const p of ['padding','padding-top','padding-right','padding-bottom','padding-left','gap','row-gap','column-gap','margin','margin-top','margin-bottom','margin-left','margin-right']){ const v=st.getPropertyValue(p); if(v) v.split(/\\s+/).forEach(x=>{ if(/^\\d+(\\.\\d+)?px$/.test(x)&&x!=='0px') space[x]=(space[x]||0)+1; }); }\n      const br=st.getPropertyValue('border-radius'); if(br) br.split(/\\s+/).forEach(x=>{ if(/px$/.test(x)) radii[x]=(radii[x]||0)+1; });\n      const bs=st.getPropertyValue('box-shadow'); if(bs&&bs!=='none') shadows[bs]=(shadows[bs]||'')+(shadows[bs]?', ':'')+r.selectorText.split(',')[0]; } } }\n  sheets.forEach(s=>walk(s.cssRules,''));\n  const seenKf=new Set(); const kfEl=document.getElementById('keyframes');\n  kf.forEach(([n,body])=>{ if(seenKf.has(n)) return; seenKf.add(n); const d=document.createElement('div'); d.innerHTML=`<b>${n}<\u002Fb><code>${body.replace(/<\u002Fg,'&lt;')}<\u002Fcode>`; kfEl.appendChild(d); });\n  const fill=(id,list)=>{ const el=document.getElementById(id); list.forEach(([s,v,m])=>{ const d=document.createElement('div'); d.innerHTML=`<code style=\"color:var(--muted)\">${s.replace(/<\u002Fg,'&lt;')}<\u002Fcode><code>${v.replace(/<\u002Fg,'&lt;')}${m?` <span style=\"color:var(--faint)\">@media ${m}<\u002Fspan>`:''}<\u002Fcode>`; el.appendChild(d); }); };\n  fill('anims',anims); fill('transitions',trans);\n  const hist=(id,obj,sort)=>{ const el=document.getElementById(id); Object.entries(obj).sort(sort).forEach(([k,v])=>{ const s=document.createElement('span'); s.innerHTML=`${k}<em>×${v}<\u002Fem>`; el.appendChild(s); }); };\n  const byPx=(a,b)=>parseFloat(a[0])-parseFloat(b[0]);\n  hist('spacing',space,byPx); hist('radii',radii,byPx);\n  const shEl=document.getElementById('shadows'); Object.entries(shadows).forEach(([v,s])=>{ const d=document.createElement('div'); d.innerHTML=`<code style=\"color:var(--muted)\">${s.replace(/<\u002Fg,'&lt;')}<\u002Fcode><code>${v}<\u002Fcode>`; shEl.appendChild(d); });\n  const bk=[...breaks].sort((a,b)=>{ const na=parseInt((a.match(/(\\d+)px/)||[])[1]||0), nb=parseInt((b.match(/(\\d+)px/)||[])[1]||0); return na-nb; });\n  const bkEl=document.getElementById('breaks'); bk.forEach(b=>{ const s=document.createElement('span'); s.textContent=b; bkEl.appendChild(s); });\n  document.getElementById('nKf').textContent=seenKf.size; document.getElementById('nAnim').textContent=anims.length; document.getElementById('nTrans').textContent=trans.length; document.getElementById('nBreak').textContent=bk.length;\n\n  /* background config, read from the running field */\n  const cfgEl=document.getElementById('bgcfg'); const cfg=(window.BG_DITHER&&window.BG_DITHER.config)||null;\n  if(cfg){ Object.entries(cfg).forEach(([k,v])=>{ const d=document.createElement('div'); const val = k==='color' ? '#'+v.map(h2).join('') : (typeof v==='object'?JSON.stringify(v):String(v)); d.innerHTML=`<b>${k}<\u002Fb><code>${val}<\u002Fcode>`; cfgEl.appendChild(d); }); const d=document.createElement('div'); d.innerHTML=`<b>mode<\u002Fb><code>${window.BG_DITHER.mode}<\u002Fcode>`; cfgEl.appendChild(d); }\n  else cfgEl.innerHTML='<div><b>bg-dither<\u002Fb><code>not running: see js/bg-dither.js CONFIG<\u002Fcode><\u002Fdiv>';\n\n  /* candles sample */\n  const g=document.getElementById('cndl'); if(g){ let y=120; const UP='#2FBF7A',DN='#F0554B'; let s=''; for(let i=0;i<30;i++){ const o=y, c=y+(Math.sin(i*1.7)*9-2); const up=c<=o; const col=up?UP:DN; const x=i*14+7; const hi=Math.min(o,c)-4, lo=Math.max(o,c)+4; s+=`<path d=\"M${x} ${hi}V${lo}\" stroke=\"${col}\" stroke-width=\"1\"/><rect x=\"${x-4.9}\" y=\"${Math.min(o,c)}\" width=\"9.8\" height=\"${Math.max(1,Math.abs(c-o))}\" fill=\"${col}\"/><rect x=\"${x-4.9}\" y=\"${180-(6+Math.abs(Math.cos(i))*22)}\" width=\"9.8\" height=\"${6+Math.abs(Math.cos(i))*22}\" fill=\"${col}\" opacity=\".28\"/>`; y=c; } g.innerHTML=s; }\n\n  /* the wordmark spec, read from .brand */\n  const b=document.querySelector('.appbar .brand'); if(b){ const c=getComputedStyle(b); document.getElementById('wmWeight').textContent=c.fontWeight; document.getElementById('wmTrack').textContent=(parseFloat(c.letterSpacing)/parseFloat(c.fontSize)*100).toFixed(0)+'%'; }\n\n  /* toc highlight */\n  const links=[...document.querySelectorAll('.toc a')]; const secs=links.map(a=>document.querySelector(a.getAttribute('href')));\n  if('IntersectionObserver' in window){ const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+e.target.id)); } }); },{rootMargin:'-20% 0px -70% 0px'}); secs.forEach(s=>s&&io.observe(s)); }\n\n  window.bbToast=function(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.getElementById('toasts').appendChild(t); setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); },2600); };\n  window.bbReplay=function(){ const bar=document.getElementById('demoBar'); bar.classList.remove('fresh','live'); void bar.offsetWidth; bar.classList.add('fresh','live'); const i=bar.querySelector('i'); i.style.width='0%'; requestAnimationFrame(()=>{ i.style.width='62%'; }); };\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
