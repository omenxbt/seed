5H8.08l4.713 6.231zm-1.161 17.52h1.833L7.08 4.126H5.117z"></path></svg></span><div><b>Link your X</b><span>Linking your X adds a verified badge to your raise. Optional.</span></div><button type="button" class="qb" data-gate-x="">Link X</button></div></div> <fieldset><legend><span class="num">01</span>Project</legend><div class="form"> <div class="f"><label for="fName">Project name</label><div class="inp"><input id="fName" maxlength="24" placeholder="Kiln" value="Seed"></div></div> <div class="f"><label for="fTicker">Ticker</label><div class="inp"><span class="suf" style="padding:0 0 0 14px">$</span><input id="fTicker" maxlength="6" placeholder="KILN" style="padding-left:4px;text-transform:uppercase" class="num" value="SEED"></div></div> <div class="f full"><label for="fDesc">Description<span class="hint">Markdown. Headings, lists, links and bold work.</span><button type="button" class="linkbtn" id="descToggle">Preview</button></label> <textarea id="fDesc" class="ta" rows="7" maxlength="6000" placeholder="What it is, who it is for, and what the raise pays for."></textarea></div> <div class="f full media"> <div class="f m-banner"><span class="lab">Banner<span class="hint">1500 × 500 px. Drag the preview to choose the crop. PNG, JPEG or WebP, 10 MB at most.</span></span> <div class="drop wide" id="upBanner" data-kind="banner" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image or choose a file</span></div></div></div> <div class="f m-art"><span class="lab">Token art<span class="hint">1:1, square</span></span> <div class="drop square" id="upArt" data-kind="art" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image</span></div></div></div> <div class="f m-deck"><span class="lab">Deck<span class="hint">PDF, PowerPoint, Keynote or an image (PNG, JPEG). 10 MB at most.</span></span> <div class="drop doc" id="upDeck" data-kind="deck"><div class="crop" data-crop=""><span>Drop your deck or choose a file</span></div></div></div> </div> </div></fieldset> <fieldset><legend><span class="num">02</span>Raise</legend><div class="form"> <div class="f full"><span class="lab">Pair with<span class="hint">Backers buy in with this asset and the Meteora pool is paired against it. Raises pair with SOL or USDC.</span></span> <div><div class="seg" id="pairSeg" role="group" aria-label="Pair asset"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 49px;"></span><button type="button" data-v="SOL" aria-pressed="true">SOL</button><button type="button" data-v="USDC" aria-pressed="false">USDC</button></div></div> </div> <div class="f full"><span class="lab">Opening market cap<i class="tip" tabindex="0" data-tip="The market cap the pool opens at. The raise is derived from it: cap × (1 − team share) ÷ 2, priced at the SOL price when the raise opens, and all of it goes into the pool.">?</i><span class="hint" id="targetUsd">at $148.2 per SOL today; fixed at the Pyth price when the raise opens</span></span> <div><div class="seg" id="capSeg" role="group" aria-label="Opening market cap"><span class="seg-ind" aria-hidden="true" style="transform: translateX(58px); width: 61px;"></span><button type="button" data-v="50000" aria-pressed="false">$50K</button><button type="button" data-v="100000" aria-pressed="true">$100K</button><button type="button" data-v="150000" aria-pressed="false">$150K</button><button type="button" data-v="200000" aria-pressed="false">$200K</button></div></div> <p class="sched-note ok num" id="raiseLine">Opens at $100K market cap · raise 337.38 SOL ($50K), all into the pool</p></div> <div class="f"><span class="lab">Deadline<i class="tip" tabindex="0" data-tip="How long the raise stays open. It closes the moment it fills; if it has not filled by the deadline, everyone is refunded, fee included.">?</i></span> <div><div class="seg" id="timeSeg" role="group" aria-label="Deadline"><span class="seg-ind" aria-hidden="true" style="transform: translateX(48px); width: 59px;"></span><button type="button" data-v="24" aria-pressed="false">24h</button><button type="button" data-v="72" aria-pressed="true">3 days</button><button type="button" data-v="168" aria-pressed="false">7 days</button><button type="button" data-v="336" aria-pressed="false">14 days</button></div></div> </div> <div class="f full derived" id="derived"><span class="lab">What backers pay<i class="tip" tabindex="0" data-tip="The price is not set by you. It is the target divided by the backers' tokens, so the pool opens at exactly what backers paid.">?</i></span><dl class="kv kv-wide" id="derivedRows"><div><dt>Price</dt><dd><span class="num">0.0₆6748 SOL</span> per token: the raise over the backers' 500,000,000 tokens</dd></div><div><dt>Fee</dt><dd><span class="num">1%</span> on top of each buy, to Seed; refunded with the buy if the raise does not seed</dd></div><div><dt>At seeding</dt><dd><span class="num">337.38 SOL</span> and <span class="num">500,000,000</span> $SEED open a Meteora pool at the raise price, locked for good</dd></div></dl></div> <div class="f lim" data-lim="min"><span class="lab"><label for="fMin">Minimum buy</label><i class="tip" tabindex="0" data-tip="The smallest buy a wallet can make. Off, any amount above zero counts.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="min" aria-label="Set a minimum buy"></button></span> <p class="lim-off" data-lim-off="">Off. Any amount counts.</p> </div> <div class="f lim" data-lim="max"><span class="lab"><label for="fMax">Maximum per wallet</label><i class="tip" tabindex="0" data-tip="The most one wallet can put in over the whole raise. Off, a single wallet may fill it.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="max" aria-label="Set a maximum per wallet"></button></span> <p class="lim-off" data-lim-off="">Off. No limit per wallet.</p> </div> </div></fieldset> <fieldset class="opt off" data-opt="alloc"><legend><span class="num">03</span>Team allocation<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></legend><div class="form"> <p class="fs-note full" data-off="">Off: no team tokens. Backers and the pool each get half of the 1B supply.</p> </div></fieldset> <fieldset><legend><span class="num">04</span>Token and links</legend><div class="form"> <div class="f full lim" data-lim="use"><span class="lab"><label for="fUse">What the token does</label><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="use" aria-label="The token has a use"></button></span> <p class="lim-off" data-lim-off="">None. Backers are told this is a bet on the team, not on a token that does something.</p> </div> <div class="f"><label for="lWebsite">Website</label><div class="inp"><input id="lWebsite" placeholder="yourproject.xyz"></div></div> <div class="f"><label for="lX">X</label><div class="inp"><input id="lX" placeholder="x.com/project"></div></div> <div class="f"><label for="lTelegram">Telegram</label><div class="inp"><input id="lTelegram" placeholder="t.me/project"></div></div> <div class="f"><label for="lDiscord">Discord</label><div class="inp"><input id="lDiscord" placeholder="discord.gg/"></div></div> <div class="f full"><label for="lGithub">GitHub</label><div class="inp"><input id="lGithub" placeholder="github.com/"></div></div> </div></fieldset> <fieldset><legend><span class="num">05</span>Payout wallet</legend><div class="form"> <p class="fs-note full">Where your share of the pool's fees and your team's unlocks go. It starts as the wallet you open with; you can move it later, and a change takes effect after 7 days and shows on the page while pending. The raise itself never reaches this wallet: it all goes into the pool.</p> <div class="f full"><label for="fPayout">Payout wallet</label><div class="inp"><input id="fPayout" class="num" placeholder="Your connected wallet" spellcheck="false" style="font-size:13px"></div></div> </div></fieldset> <fieldset class="opt off" data-opt="team"><legend><span class="num">06</span>Team members<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="team" aria-label="Add team"></button></legend> <p class="fs-note" data-off="">Left off, your page lists no team beyond the founder. Turn it on to list the people behind the project.</p> </fieldset> <div class="lsubmit"><div class="err" id="fErr" role="alert"></div><button class="btn btn-navy btn-lg btn-block" id="openBtn" type="button">Open raise</button><p class="rail-cap" id="upNote">Uploads go to Seed’s storage when you open the raise.</p></div> </form> </div> <aside class="ws-rail" aria-label="Preview and info"> <section class="panel rail-card"><h3>How backers will see it</h3><div class="pcard"><div id="pvCard"><div class="pv-banner"><img src="site/assets/film/banner.png" alt="" style="object-position:50.0% 50.0%"></div><div class="pv-id"><img class="pv-art" src="site/assets/film/art.png" alt="" style="object-position:50.0% 50.0%"><span class="nm"><b>Seed<span class="tk">$SEED</span></b><span class="meta"><span class="chain">Pairs with SOL</span></span></span></div><div class="c-prog"><span class="bar"><i style="width:0%"></i></span><span class="pct num">0%</span></div></div></div><dl class="facts" id="pvFacts"><div><dt>Opens at</dt><dd><span class="num">$100K</span> market cap: the raise is $100K × 100% ÷ 2 = <span class="num">$50K</span></dd></div><div><dt>The split</dt><dd><span class="num">50%</span> backers, <span class="num">50%</span> pool, <span class="num">0%</span> team</dd></div><div><dt>Raise price</dt><dd><span class="num">0.0₆6748 SOL</span> per token, fixed</dd></div><div><dt>FDV at the raise</dt><dd><span class="num">674.76 SOL</span> ($100K)</dd></div><div><dt>Pool at seeding</dt><dd><span class="num">337.38 SOL</span> + <span class="num">500,000,000</span> $SEED, locked for good</dd></div><div><dt>Pool depth</dt><dd><span class="num">337.38 SOL</span> each side at opening (674.76 SOL, $100K in all)</dd></div><div><dt>Team unlocks</dt><dd>No team tokens</dd></div><div><dt>Your fee income</dt><dd><span class="num">$35</span>, <span class="num">$175</span> or <span class="num">$700</span> a day at $5K, $25K or $100K of daily volume</dd></div><div><dt>Closes</dt><dd>Oct 20, 3:36 PM, or the moment it fills</dd></div><div><dt>If it misses</dt><dd>Short of the target when the 3 days are up: every buy and its fee go back to backers, claimable at once. Nothing is minted</dd></div></dl></section> <section class="panel rail-card" id="pvInfo"><div class="rail-h"><h3>Info</h3><span class="risk-chip pass"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.3l1.9 1.9 3.8-4.1"></path></svg>Passing so far</span></div><p class="rail-meta">What backers will see on your page. Checks marked with a clock run once the raise is live; your choices are shown as facts.</p><ul class="risk-list"><li class="pass"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.3l1.9 1.9 3.8-4.1"></path></svg><div><b>Past raises</b><span>The first raise by this account on Seed.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Top 10 backers</b><span>Checked once backers arrive.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Bundled wallets</b><span>Checked once backers arrive.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Fresh wallets</b><span>Checked once backers arrive.</span></div></li></ul><p class="info-h">The founder's choices</p><ul class="risk-list"><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Founder X account</b><span>None linked. Optional: linking X adds a verified badge.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Name and ticker</b><span>No clash with a live Seed raise or a top-500 Solana token.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Website</b><span>None listed. Optional.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Team share</b><span>No team tokens. The supply splits evenly between backers and the locked pool.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>What the token does</b><span>Nothing stated. This is a bet on the team, not on a token with a use.</span></div></li></ul></section> </aside> </div> </section> <!-- ----------------------------------------------------- PORTFOLIO --> </main>

</header> <main class="appmain"> <!-- ------------------------------------------------------ TERMINAL --> <!-- ------------------------------------------------------- PRESALE --> <section id="tab-launch"> <div class="ws"> <aside class="ws-side" aria-label="About this form"> <section class="panel pagehead"> <h1><i>Start</i>a raise</h1> <p>Everything backers see on your project page, before you open. The supply is 1B, minted at seeding with mint and freeze revoked; the raise opens a locked pool at a fixed price. Opening is free.</p> <nav class="steps" aria-label="Form sections"><button type="button" data-step="1"><span class="num">01</span>Project</button><button type="button" data-step="2"><span class="num">02</span>Raise</button><div class="step-opt"><button type="button" data-step="3"><span class="num">03</span>Team allocation</button><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></div><button type="button" data-step="4"><span class="num">04</span>Token and links</button><button type="button" data-step="5"><span class="num">05</span>Payout wallet</button><span class="steps-h">Optional</span><div class="step-opt"><button type="button" data-step="6"><span class="num">06</span>Team members</button><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="team" aria-label="Add team"></button></div></nav> </section> <section class="panel"><h3 class="card-h">Your raises</h3><div id="mineList"><div class="empty">You have not opened a raise yet. Fill in the form to open your first.</div></div></section> </aside> <div class="ws-main" data-hf-scroll="942,0"> <form class="panel lform" id="form" novalidate="" autocomplete="off" onsubmit="return false"> <div class="xgate" id="xGate"><div class="gate"><span class="g-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.08 4.126H5.117z"></path></svg></span><div><b>Link your X</b><span>Linking your X adds a verified badge to your raise. Optional.</span></div><button type="button" class="qb" data-gate-x="">Link X</button></div></div> <fieldset><legend><span class="num">01</span>Project</legend><div class="form"> <div class="f"><label for="fName">Project name</label><div class="inp"><input id="fName" maxlength="24" placeholder="Kiln" value="Seed"></div></div> <div class="f"><label for="fTicker">Ticker</label><div class="inp"><span class="suf" style="padding:0 0 0 14px">$</span><input id="fTicker" maxlength="6" placeholder="KILN" style="padding-left:4px;text-transform:uppercase" class="num" value="SEED"></div></div> <div class="f full"><label for="fDesc">Description<span class="hint">Markdown. Headings, lists, links and bold work.</span><button type="button" class="linkbtn" id="descToggle">Preview</button></label> <textarea id="fDesc" class="ta" rows="7" maxlength="6000" placeholder="What it is, who it is for, and what the raise pays for."></textarea></div> <div class="f full media"> <div class="f m-banner"><span class="lab">Banner<span class="hint">1500 × 500 px. Drag the preview to choose the crop. PNG, JPEG or WebP, 10 MB at most.</span></span> <div class="drop wide" id="upBanner" data-kind="banner" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image or choose a file</span></div></div></div> <div class="f m-art"><span class="lab">Token art<span class="hint">1:1, square</span></span> <div class="drop square" id="upArt" data-kind="art" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image</span></div></div></div> <div class="f m-deck"><span class="lab">Deck<span class="hint">PDF, PowerPoint, Keynote or an image (PNG, JPEG). 10 MB at most.</span></span> <div class="drop doc" id="upDeck" data-kind="deck"><div class="crop" data-crop=""><span>Drop your deck or choose a file</span></div></div></div> </div> </div></fieldset> <fieldset><legend><span class="num">02</span>Raise</legend><div class="form"> <div class="f full"><span class="lab">Pair with<span class="hint">Backers buy in with this asset and the Meteora pool is paired against it. Raises pair with SOL or USDC.</span></span> <div><div class="seg" id="pairSeg" role="group" aria-label="Pair asset"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 49px;"></span><button type="button" data-v="SOL" aria-pressed="true">SOL</button><button type="button" data-v="USDC" aria-pressed="false">USDC</button></div></div> </div> <div class="f full"><span class="lab">Opening market cap<i class="tip" tabindex="0" data-tip="The market cap the pool opens at. The raise is derived from it: cap × (1 − team share) ÷ 2, priced at the SOL price when the raise opens, and all of it goes into the pool.">?</i><span class="hint" id="targetUsd">at $148.2 per SOL today; fixed at the Pyth price when the raise opens</span></span> <div><div class="seg" id="capSeg" role="group" aria-label="Opening market cap"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 55px;"></span><button type="button" data-v="50000" aria-pressed="true">$50K</button><button type="button" data-v="100000" aria-pressed="false">$100K</button><button type="button" data-v="150000" aria-pressed="false">$150K</button><button type="button" data-v="200000" aria-pressed="false">$200K</button></div></div> <p class="sched-note ok num" id="raiseLine">Opens at $50K market cap · raise 168.69 SOL ($25K), all into the pool</p></div> <div class="f"><span class="lab">Deadline<i class="tip" tabindex="0" data-tip="How long the raise stays open. It closes the moment it fills; if it has not filled by the deadline, everyone is refunded, fee included.">?</i></span> <div><div class="seg" id="timeSeg" role="group" aria-label="Deadline"><span class="seg-ind" aria-hidden="true" style="transform: translateX(48px); width: 59px;"></span><button type="button" data-v="24" aria-pressed="false">24h</button><button type="button" data-v="72" aria-pressed="true">3 days</button><button type="button" data-v="168" aria-pressed="false">7 days</button><button type="button" data-v="336" aria-pressed="false">14 days</button></div></div> </div> <div class="f full derived" id="derived"><span class="lab">What backers pay<i class="tip" tabindex="0" data-tip="The price is not set by you. It is the target divided by the backers' tokens, so the pool opens at exactly what backers paid.">?</i></span><dl class="kv kv-wide" id="derivedRows"><div><dt>Price</dt><dd><span class="num">0.0₆3374 SOL</span> per token: the raise over the backers' 500,000,000 tokens</dd></div><div><dt>Fee</dt><dd><span class="num">1%</span> on top of each buy, to Seed; refunded with the buy if the raise does not seed</dd></div><div><dt>At seeding</dt><dd><span class="num">168.69 SOL</span> and <span class="num">500,000,000</span> $SEED open a Meteora pool at the raise price, locked for good</dd></div></dl></div> <div class="f lim" data-lim="min"><span class="lab"><label for="fMin">Minimum buy</label><i class="tip" tabindex="0" data-tip="The smallest buy a wallet can make. Off, any amount above zero counts.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="min" aria-label="Set a minimum buy"></button></span> <p class="lim-off" data-lim-off="">Off. Any amount counts.</p> </div> <div class="f lim" data-lim="max"><span class="lab"><label for="fMax">Maximum per wallet</label><i class="tip" tabindex="0" data-tip="The most one wallet can put in over the whole raise. Off, a single wallet may fill it.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="max" aria-label="Set a maximum per wallet"></button></span> <p class="lim-off" data-lim-off="">Off. No limit per wallet.</p> </div> </div></fieldset> <fieldset class="opt off" data-opt="alloc"><legend><span class="num">03</span>Team allocation<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></legend><div class="form"> <p class="fs-note full" data-off="">Off: no team tokens. Backers and the pool each get half of the 1B supply.</p> </div></fieldset> <fieldset><legend><span class="num">04</span>Token and links</legend><div class="form"> <div class="f full lim" data-lim="use"><span class="lab"><label for="fUse">What the token does</label><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="use" aria-label="The token has a use"></button></span> <p class="lim-off" data-lim-off="">None. Backers are told this is a bet on the team, not on a token that does something.</p> </div> <div class="f"><label for="lWebsite">Website</label><div class="inp"><input id="lWebsite" placeholder="yourproject.xyz"></div></div> <div class="f"><label for="lX">X</label><div class="inp"><input id="lX" placeholder="x.com/project"></div></div> <div class="f"><label for="lTelegram">Telegram</label><div class="inp"><input id="lTelegram" placeholder="t.me/project"></div></div> <div class="f"><label for="lDiscord">Discord</label><div class="inp"><input id="lDiscord" placeholder="discord.gg/"></div></div> <div class="f full"><label for="lGithub">GitHub</label><div class="inp"><input id="lGithub" placeholder="github.com/"></div></div> </div></fieldset> <fieldset><legend><span class="num">05</span>Payout wallet</legend><div class="form"> <p class="fs-note full">Where your share of the pool's fees and your team's unlocks go. It starts as the wallet you open with; you can move it later, and a change takes effect after 7 days and shows on the page while pending. The raise itself never reaches this wallet: it all goes into the pool.</p> <div class="f full"><label for="fPayout">Payout wallet</label><div class="inp"><input id="fPayout" class="num" placeholder="Your connected wallet" spellcheck="false" style="font-size:13px"></div></div> </div></fieldset> <fieldset class="opt off" data-opt="team"><legend><span class="num">06</span>Team members<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="team" aria-label="Add team"></button></legend> <p class="fs-note" data-off="">Left off, your page lists no team beyond the founder. Turn it on to list the people behind the project.</p> </fieldset> <div class="lsubmit"><div class="err" id="fErr" role="alert"></div><button class="btn btn-navy btn-lg btn-block" id="openBtn" type="button">Open raise</button><p class="rail-cap" id="upNote">Uploads go to Seed’s storage when you open the raise.</p></div> </form> </div> <aside class="ws-rail" aria-label="Preview and info"> <section class="panel rail-card"><h3>How backers will see it</h3><div class="pcard"><div id="pvCard"><div class="pv-banner"><img src="site/assets/film/banner.png" alt="" style="object-position:50.0% 50.0%"></div><div class="pv-id"><img class="pv-art" src="site/assets/film/art.png" alt="" style="object-position:50.0% 50.0%"><span class="nm"><b>Seed<span class="tk">$SEED</span></b><span class="meta"><span class="chain">Pairs with SOL</span></span></span></div><div class="c-prog"><span class="bar"><i style="width:0%"></i></span><span class="pct num">0%</span></div></div></div><dl class="facts" id="pvFacts"><div><dt>Opens at</dt><dd><span class="num">$50K</span> market cap: the raise is $50K × 100% ÷ 2 = <span class="num">$25K</span></dd></div><div><dt>The split</dt><dd><span class="num">50%</span> backers, <span class="num">50%</span> pool, <span class="num">0%</span> team</dd></div><div><dt>Raise price</dt><dd><span class="num">0.0₆3374 SOL</span> per token, fixed</dd></div><div><dt>FDV at the raise</dt><dd><span class="num">337.38 SOL</span> ($50K)</dd></div><div><dt>Pool at seeding</dt><dd><span class="num">168.69 SOL</span> + <span class="num">500,000,000</span> $SEED, locked for good</dd></div><div><dt>Pool depth</dt><dd><span class="num">168.69 SOL</span> each side at opening (337.38 SOL, $50K in all)</dd></div><div><dt>Team unlocks</dt><dd>No team tokens</dd></div><div><dt>Your fee income</dt><dd><span class="num">$35</span>, <span class="num">$175</span> or <span class="num">$700</span> a day at $5K, $25K or $100K of daily volume</dd></div><div><dt>Closes</dt><dd>Oct 20, 3:36 PM, or the moment it fills</dd></div><div><dt>If it misses</dt><dd>Short of the target when the 3 days are up: every buy and its fee go back to backers, claimable at once. Nothing is minted</dd></div></dl></section> <section class="panel rail-card" id="pvInfo"><div class="rail-h"><h3>Info</h3><span class="risk-chip pass"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.3l1.9 1.9 3.8-4.1"></path></svg>Passing so far</span></div><p class="rail-meta">What backers will see on your page. Checks marked with a clock run once the raise is live; your choices are shown as facts.</p><ul class="risk-list"><li class="pass"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.3l1.9 1.9 3.8-4.1"></path></svg><div><b>Past raises</b><span>The first raise by this account on Seed.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Top 10 backers</b><span>Checked once backers arrive.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Bundled wallets</b><span>Checked once backers arrive.</span></div></li><li class="pending"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg><div><b>Fresh wallets</b><span>Checked once backers arrive.</span></div></li></ul><p class="info-h">The founder's choices</p><ul class="risk-list"><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Founder X account</b><span>None linked. Optional: linking X adds a verified badge.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Name and ticker</b><span>No clash with a live Seed raise or a top-500 Solana token.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Website</b><span>None listed. Optional.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>Team share</b><span>No team tokens. The supply splits evenly between backers and the locked pool.</span></div></li><li class="info"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 7.2v4M8 4.9v.1"></path></svg><div><b>What the token does</b><span>Nothing stated. This is a bet on the team, not on a token with a use.</span></div></li></ul></section> </aside> </div> </section> <!-- ----------------------------------------------------- PORTFOLIO --> </main>

</header> <main class="appmain"> <!-- ------------------------------------------------------ TERMINAL --> <!-- ------------------------------------------------------- PRESALE --> <section id="tab-launch"> <div class="ws"> <aside class="ws-side" aria-label="About this form"> <section class="panel pagehead"> <h1><i>Start</i>a raise</h1> <p>Everything backers see on your project page, before you open. The supply is 1B, minted at seeding with mint and freeze revoked; the raise opens a locked pool at a fixed price. Opening is free.</p> <nav class="steps" aria-label="Form sections"><button type="button" data-step="1"><span class="num">01</span>Project</button><button type="button" data-step="2"><span class="num">02</span>Raise</button><div class="step-opt"><button type="button" data-step="3"><span class="num">03</span>Team allocation</button><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></div><button type="button" data-step="4"><span class="num">04</span>Token and links</button><button type="button" data-step="5"><span class="num">05</span>Payout wallet</button><span class="steps-h">Optional</span><div class="step-opt"><button type="button" data-step="6"><span class="num">06</span>Team members</button><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="team" aria-label="Add team"></button></div></nav> </section> <section class="panel"><h3 class="card-h">Your raises</h3><div id="mineList"><div class="empty">You have not opened a raise yet. Fill in the form to open your first.</div></div></section> </aside> <div class="ws-main" data-hf-scroll="942,0"> <form class="panel lform" id="form" novalidate="" autocomplete="off" onsubmit="return false"> <div class="xgate" id="xGate"><div class="gate"><span class="g-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.08 4.126H5.117z"></path></svg></span><div><b>Link your X</b><span>Linking your X adds a verified badge to your raise. Optional.</span></div><button type="button" class="qb" data-gate-x="">Link X</button></div></div> <fieldset><legend><span class="num">01</span>Project</legend><div class="form"> <div class="f"><label for="fName">Project name</label><div class="inp"><input id="fName" maxlength="24" placeholder="Kiln" value="Seed"></div></div> <div class="f"><label for="fTicker">Ticker</label><div class="inp"><span class="suf" style="padding:0 0 0 14px">$</span><input id="fTicker" maxlength="6" placeholder="KILN" style="padding-left:4px;text-transform:uppercase" class="num" value="SEED"></div></div> <div class="f full"><label for="fDesc">Description<span class="hint">Markdown. Headings, lists, links and bold work.</span><button type="button" class="linkbtn" id="descToggle">Preview</button></label> <textarea id="fDesc" class="ta" rows="7" maxlength="6000" placeholder="What it is, who it is for, and what the raise pays for."></textarea></div> <div class="f full media"> <div class="f m-banner"><span class="lab">Banner<span class="hint">1500 × 500 px. Drag the preview to choose the crop. PNG, JPEG or WebP, 10 MB at most.</span></span> <div class="drop wide" id="upBanner" data-kind="banner" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image or choose a file</span></div></div></div> <div class="f m-art"><span class="lab">Token art<span class="hint">1:1, square</span></span> <div class="drop square" id="upArt" data-kind="art" data-accept="image/png,image/jpeg,image/webp"><div class="crop" data-crop=""><span>Drop an image</span></div></div></div> <div class="f m-deck"><span class="lab">Deck<span class="hint">PDF, PowerPoint, Keynote or an image (PNG, JPEG). 10 MB at most.</span></span> <div class="drop doc" id="upDeck" data-kind="deck"><div class="crop" data-crop=""><span>Drop your deck or choose a file</span></div></div></div> </div> </div></fieldset> <fieldset><legend><span class="num">02</span>Raise</legend><div class="form"> <div class="f full"><span class="lab">Pair with<span class="hint">Backers buy in with this asset and the Meteora pool is paired against it. Raises pair with SOL or USDC.</span></span> <div><div class="seg" id="pairSeg" role="group" aria-label="Pair asset"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 49px;"></span><button type="button" data-v="SOL" aria-pressed="true">SOL</button><button type="button" data-v="USDC" aria-pressed="false">USDC</button></div></div> </div> <div class="f full"><span class="lab">Opening market cap<i class="tip" tabindex="0" data-tip="The market cap the pool opens at. The raise is derived from it: cap × (1 − team share) ÷ 2, priced at the SOL price when the raise opens, and all of it goes into the pool.">?</i><span class="hint" id="targetUsd">at $148.2 per SOL today; fixed at the Pyth price when the raise opens</span></span> <div><div class="seg" id="capSeg" role="group" aria-label="Opening market cap"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 55px;"></span><button type="button" data-v="50000" aria-pressed="true">$50K</button><button type="button" data-v="100000" aria-pressed="false">$100K</button><button type="button" data-v="150000" aria-pressed="false">$150K</button><button type="button" data-v="200000" aria-pressed="false">$200K</button></div></div> <p class="sched-note ok num" id="raiseLine">Opens at $50K market cap · raise 168.69 SOL ($25K), all into the pool</p></div> <div class="f"><span class="lab">Deadline<i class="tip" tabindex="0" data-tip="How long the raise stays open. It closes the moment it fills; if it has not filled by the deadline, everyone is refunded, fee included.">?</i></span> <div><div class="seg" id="timeSeg" role="group" aria-label="Deadline"><span class="seg-ind" aria-hidden="true" style="transform: translateX(108px); width: 59px;"></span><button type="button" data-v="24" aria-pressed="false">24h</button><button type="button" data-v="72" aria-pressed="false">3 days</button><button type="button" data-v="168" aria-pressed="true">7 days</button><button type="button" data-v="336" aria-pressed="false">14 days</button></div></div> </div> <div class="f full derived" id="derived"><span class="lab">What backers pay<i class="tip" tabindex="0" data-tip="The price is not set by you. It is the target divided by the backers' tokens, so the pool opens at exactly what backers paid.">?</i></span><dl class="kv kv-wide" id="derivedRows"><div><dt>Price</dt><dd><span class="num">0.0₆3374 SOL</span> per token: the raise over the backers' 500,000,000 tokens</dd></div><div><dt>Fee</dt><dd><span class="num">1%</span> on top of each buy, to Seed; refunded with the buy if the raise does not seed</dd></div><div><dt>At seeding</dt><dd><span class="num">168.69 SOL</span> and <span class="num">500,000,000</span> $SEED open a Meteora pool at the raise price, locked for good</dd></div></dl></div> <div class="f lim" data-lim="min"><span class="lab"><label for="fMin">Minimum buy</label><i class="tip" tabindex="0" data-tip="The smallest buy a wallet can make. Off, any amount above zero counts.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="min" aria-label="Set a minimum buy"></button></span> <p class="lim-off" data-lim-off="">Off. Any amount counts.</p> </div> <div class="f lim" data-lim="max"><span class="lab"><label for="fMax">Maximum per wallet</label><i class="tip" tabindex="0" data-tip="The most one wallet can put in over the whole raise. Off, a single wallet may fill it.">?</i><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="max" aria-label="Set a maximum per wallet"></button></span> <p class="lim-off" data-lim-off="">Off. No limit per wallet.</p> </div> </div></fieldset> <fieldset class="opt off" data-opt="alloc"><legend><span class="num">03</span>Team allocation<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></legend><div class="form"> <p class="fs-note full" data-off="">Off: no team tokens. Backers and the pool each get half of the 1B supply.</p> </div></fieldset> <fieldset><legend><span class="num">04</span>Token and links</legend><div class="form"> <div class="f full lim" data-lim="use"><span class="lab"><label for="fUse">What the token does</label><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="use" aria-label="The token has a use"></button></span> <p class="lim-off" data-lim-off="">None. Backers are told this is a bet on the team, not on a token that does something.</p> </div> <div class="f"><label for="lWebsite">Website</label><div class="inp"><input id="lWebsite" placeholder="yourproject.xyz"></div></div> <div class="f"><label for="lX">X</label><div class="inp"><input id="lX" placeholder="x.com/project"></div></div> <div class="f"><label for="lTelegram">Telegram</label><div class="inp"><input id="lTelegram" placeholder="t.me/project"></div></div> <div class="f"><label for="lDiscord">Discord</label><div class="inp"><input id="lDiscord" placeholder="discord.gg/"></div></div> <div class="f full"><label for="lGithub">GitHub</label><div class="inp"><input id="lGithub" placeholder="github.com/"></div></div> </div></fieldset> <fieldset><legend><span class="num">05</span>Payout wallet</legend><div class="form"> <p class="fs-note full">Where your share of the pool's fees and your team's unlocks go. It starts as the wallet you open with; you can move it later, and a change takes effect after 7 days and shows on the page while pending. The raise itself never reaches this wallet: it all goes into the pool.</p> <div class="f full"><label for="fPayout">Payout wallet</label><div class="inp"><input id="fPayout" cl hoose a file</span></div></div></div> </div> </div></fieldset> <fieldset><legend><span class="num">02</span>Raise</legend><div class="form"> <div class="f full"><span class="lab">Pair with<span class="hint">Backers buy in with this asset and the Meteora pool is paired against it. Raises pair with SOL or USDC.</span></span> <div><div class="seg" id="pairSeg" role="group" aria-label="Pair asset"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 49px;"></span><button type="button" data-v="SOL" aria-pressed="true">SOL</button><button type="button" data-v="USDC" aria-pressed="false">USDC</button></div></div> </div> <div class="f full"><span class="lab">Opening market cap<i class="tip" tabindex="0" data-tip="The market cap the pool opens at. The raise is derived from it: cap × (1 − team share) ÷ 2, priced at the SOL price when the raise opens, and all of it goes into the pool.">?</i><span class="hint" id="targetUsd">at $148.2 per SOL today; fixed at the Pyth price when the raise opens</span></span> <div><div class="seg" id="capSeg" role="group" aria-label="Opening market cap"><span class="seg-ind" aria-hidden="true" style="transform: translateX(3px); width: 55px;"></span><button type="button" data-v="50000" aria-pressed="true">$50K</button><button type="button" data-v="100000" aria-pressed="false">$100K</button><button type="button" data-v="150000" aria-pressed="false">$150K</button><button type="button" data-v="200000" aria-pressed="false">$200K</button></div></div> <p class="sched-note ok num" id="raiseLine">Opens at $50K market cap · raise 168.69 SOL ($25K), all into the pool</p></div> <div class="f"><span class="lab">Deadline<i class="tip" tabindex="0" data-tip="How long the raise stays open. It closes the moment it fills; if it has not filled by the deadline, everyone is refunded, fee included.">?</i></span> <div><div class="seg" id="timeSeg" role="group" aria-label="Deadline"><span class="seg-ind" aria-hidden="true" style="transform: opt="alloc"><legend><span class="num">03</span>Team allocation<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="alloc" aria-label="Team allocation"></button></legend><div class="form"> <p class="fs-note full" data-off="">Off: no team tokens. Backers and the pool each get half of the 1B supply.</p> </div></fieldset> <fieldset><legend><span class="num">04</span>Token and links</legend><div class="form"> <div class="f full lim" data-lim="use"><span class="lab"><label for="fUse">What the token does</label><button type="button" class="switch" role="switch" aria-checked="false" data-lim-toggle="use" aria-label="The token has a use"></button></span> <p class="lim-off" data-lim-off="">None. Backers are told this is a bet on the team, not on a token that does something.</p> </div> <div class="f"><label for="lWebsite">Website</label><div class="inp"><input id="lWebsite" placeholder="yourproject.xyz"></div></div> <div class="f"><label for="lX">X</label><div class="inp"><input id="lX" placeholder="x.com/project"></div></div> <div class="f"><label for="lTelegram">Telegram</label><div class="inp"><input id="lTelegram" placeholder="t.me/project"></div></div> <div class="f"><label for="lDiscord">Discord</label><div class="inp"><input id="lDiscord" placeholder="discord.gg/"></div></div> <div class="f full"><label for="lGithub">GitHub</label><div class="inp"><input id="lGithub" placeholder="github.com/"></div></div> </div></fieldset> <fieldset><legend><span class="num">05</span>Payout wallet</legend><div class="form"> <p class="fs-note full">Where your share of the pool's fees and your team's unlocks go. It starts as the wallet you open with; you can move it later, and a change takes effect after 7 days and shows on the page while pending. The raise itself never reaches this wallet: it all goes into the pool.</p> <div class="f full"><label for="fPayout">Payout wallet</label><div class="inp"><input id="fPayout" class="num" placeholder="Your connected wallet" spellcheck="false" style="font-size:13px"></div></div> </div></fieldset> <fieldset class="opt off" data-opt="team"><legend><span class="num">06</span>Team members<span class="opt-tag">Optional</span><button type="button" class="switch" role="switch" aria-checked="false" data-toggle="team" aria-label="Add team"></button></legend> <p class="fs-note" data-off="">Left off, your page lists no team beyond the founder. Turn it on to list the people behind the project.</p> </fieldset> <div class="lsubmit"><div class="err" id="fErr" role="alert"></div><button class="btn btn-navy btn-lg btn-block" id="openBtn" type="button" disabled="">Confirm in wallet…</button><p class="rail-cap" id="upNote">Uploads go to Seed’s storage when you open the raise.</p></div> </form> </div> <aside class="ws-rail" aria-label="Preview and info"> <section class="panel rail-card"><h3>How backers will see it</h3><div class="pcard"><div id="pvCard"><div class="pv-banner"><img src="site/assets/film/banner.png" alt="" style="object-position:50.0% 50.0%"></div><div class="pv-id"><img class="pv-art" src="site/assets/film/art.png" alt="" style="object-position:50.0% 50.0%"><span class="nm"><b>Seed<span class="tk">$SEED</span></b><span class="meta"><span class="chain">Pairs with SOL</span></span></span></div><div class="c-prog"><span class="bar"><i style="width:0%"></i></span><span class="pct num">0%</span></div></div></div><dl class="facts" id="pvFacts"><div><dt>Opens at</dt><dd><span class="num">$50K</span> market cap: the raise is $50K × 100% ÷ 2 = <span class="num">$25K</span></dd></div><div><dt>The split</dt><dd><span class="num">50%</span> backers, <span class="num">50%</span> pool, <span class="num">0%</span> team</dd></div><div><dt>Raise price</dt><dd><span class="num">0.0₆3374 SOL</span> per token, fixed</dd></div><div><dt>FDV at the raise</dt><dd><span class="num">337.38 SOL</span> ($50K)</dd></div><div><dt>Pool at seeding</dt><dd><span class="num">168    it at this format's window (tools/capture-pages.mjs; the beat's state is mounted from its <script type="text/html">),
   laid out S.zoom times larger (CSS zoom) so the closest shot is still drawn finer than the frame (story.mjs, ZOOM).
   The camera's keys (story.mjs) are solved against the page's real layout at load: an element's box, the scale that makes
   it fill the format's focus box, a tilt. Each key eases from wherever the camera is to its pose on the brand's one curve,
   cubic-bezier(.22,1,.36,1): fast off the mark, then a long settle, so a cut reads as a whip and a hold is still a slow
   push. A page fills the screen: every pose is kept where the page covers the whole frame, tilt and all, so no edge of it
   shows until the whip that takes it away. Text frames fly the same camera over their type. From the camera's own path
   each frame gets
   - depth of field: a blur over everything outside an ellipse round the element in focus (#dof, a masked backdrop blur);
   - motion blur: the camera's travel since the last frame, as a directional blur (#mb, an SVG blur on the backdrop).
   Both sit over the page, so a frosted panel keeps its glass (a filter on its ancestor would take it away).

   The site's motion, as the site draws it: entrances rising 10px in .5s (60ms a column, 45ms a card), a press scaling to
   .97 in 80ms, the fill bar taking .6s, the odometer .55s a digit, the sheen coming round every 3.2s, a buy's chip
   (chipUp), the chart line drawing in 1.7s with the area at 1.1s and the tip at 1.8s. Colour takes .18s, anything that
