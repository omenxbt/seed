<!doctype html><html><head><meta charset="utf-8"><title>Seed banner banner-02-tagline</title><style>
@import url("../fonts/fonts.css");
:root{--bg:#16171A;--paper:#121316;--card:#25272C;--raised:#30333A;--well:#111215;--panel:rgba(31,33,37,.55);--panel-line:rgba(255,255,255,.1);
--ink:#F3F4F6;--ink-2:#D3D6DC;--muted:#9DA2AC;--faint:#868B95;--navy:#5B8CFF;--navy-deep:#A4C0FF;--navy-soft:#52668F;--solid:#2E63E7;
--ok:#45DB93;--ok-ink:#7BE8B2;--bad:#FF7268;--bad-ink:#FF9B93;--chip:rgba(255,255,255,.06);--hair:rgba(255,255,255,.08);--hair-2:rgba(255,255,255,.17);
--grad-btn:linear-gradient(180deg,#5B8CFF 0%,#2E63E7 100%);--grad-seg:linear-gradient(180deg,rgba(91,140,255,.34),rgba(46,99,231,.2));--seg-line:rgba(91,140,255,.42);
--glow:0 0 0 1px rgba(91,140,255,.32),0 10px 28px -10px rgba(46,99,231,.8);--glow-sm:0 0 14px -4px rgba(46,99,231,.7);--lit:inset 0 1px 0 rgba(255,255,255,.14);
--hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px);--progress:linear-gradient(90deg,#F2554C,#F6C445 50%,#34C17B);
--sans:'Instrument Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:500px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
.b{position:relative;width:1500px;height:500px;overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.field{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1.1px,transparent 1.2px);background-size:14px 14px}
.hatch{position:absolute;inset:0;background:var(--hatch)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);background:rgba(46,99,231,.42)}
.mark{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:500;white-space:nowrap}
.btn-ink{background:var(--grad-btn);color:#fff;box-shadow:var(--lit),var(--glow)}
.btn-ghost{background:var(--chip);border:1px solid var(--hair-2);color:var(--ink)}
.wm{font-weight:600;letter-spacing:-.03em;color:var(--ink)}
h1{font-weight:500;letter-spacing:-.045em;line-height:1.02}
h1 i{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.02em;font-size:1.1em}
.lockup{display:flex;align-items:center;gap:12px}
.lockup .mark{width:48px;height:48px}
.lockup .wm{font-size:30px}
.statchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--chip);border:1px solid var(--hair);font-size:14px;color:var(--ink-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.statchip b{font-weight:500;font-family:var(--mono);letter-spacing:-.03em;color:var(--ink)}.statchip em{font-style:normal;color:var(--muted)}
.rank{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 9px;border-radius:7px;font-family:var(--mono);font-size:13.5px;color:#fff;background:var(--grad-seg);border:1px solid var(--seg-line);box-shadow:var(--lit)}
.strip{position:relative;display:inline-block;width:200px;height:22px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--hair-2) 0 2px,transparent 2px 5px);overflow:hidden}
.strip i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--navy-deep) 0 2px,transparent 2px 5px)}
.strip.ok i{background:repeating-linear-gradient(90deg,var(--ok) 0 2px,transparent 2px 5px)}
.bar{position:relative;height:3px;border-radius:2px;background:var(--hair-2);overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--progress)}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(26px) saturate(130%)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:999px;padding:3px 9px;border:1px solid var(--hair-2);color:var(--muted);background:var(--chip)}
.tag.ok{color:var(--ok-ink);border-color:rgba(69,219,147,.3);background:rgba(69,219,147,.14)}
.tag.live{color:var(--navy-deep);border-color:var(--seg-line);background:var(--grad-seg)}
</style></head><body><div class="b"><div class="field" style="-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 80%);mask-image:linear-gradient(90deg,transparent 35%,#000 80%)"></div><div class="glow" style="width:700px;height:700px;right:-220px;top:-120px;opacity:.5"></div><svg class="mark" viewBox="0 0 100 100" style="position:absolute;right:-70px;top:-10px;width:560px;height:560px;filter:drop-shadow(0 0 40px rgba(46,99,231,.35))"><circle cx="42.0" cy="56.7" r="6.91" fill="#5B8CFF"/><circle cx="50.27" cy="36.69" r="6.74" fill="rgba(255,255,255,.14)"/><circle cx="59.2" cy="63.42" r="6.57" fill="rgba(255,255,255,.14)"/><circle cx="30.17" cy="46.87" r="6.39" fill="rgba(255,255,255,.14)"/><circle cx="67.19" cy="38.7" r="6.22" fill="rgba(255,255,255,.14)"/><circle cx="42.97" cy="72.93" r="6.05" fill="rgba(255,255,255,.14)"/><circle cx="37.37" cy="27.67" r="5.88" fill="rgba(255,255,255,.14)"/><circle cx="74.59" cy="59.53" r="5.7" fill="rgba(255,255,255,.14)"/><circle cx="22.45" cy="61.21" r="5.53" fill="rgba(255,255,255,.14)"/><circle cx="61.95" cy="22.72" r="5.36" fill="rgba(255,255,255,.14)"/><circle cx="58.61" cy="80.6" r="5.18" fill="rgba(255,255,255,.14)"/><circle cx="20.3" cy="33.54" r="5.01" fill="rgba(255,255,255,.14)"/><circle cx="82.89" cy="42.79" r="4.84" fill="rgba(255,255,255,.14)"/><circle cx="28.42" cy="79.61" r="4.67" fill="rgba(255,255,255,.14)"/><circle cx="44.3" cy="13.34" r="4.49" fill="rgba(255,255,255,.14)"/><circle cx="78.45" cy="74.97" r="4.32" fill="rgba(255,255,255,.14)"/><circle cx="9.52" cy="51.85" r="4.15" fill="rgba(255,255,255,.14)"/><circle cx="77.95" cy="21.48" r="3.98" fill="rgba(255,255,255,.14)"/><circle cx="47.15" cy="92.03" r="3.8" fill="rgba(255,255,255,.14)"/><circle cx="21.57" cy="17.25" r="3.63" fill="rgba(255,255,255,.14)"/><circle cx="92.69" cy="56.09" r="3.46" fill="rgba(255,255,255,.14)"/></svg><div style="position:absolute;left:96px;top:56px;width:860px"><div class="lockup" style="margin-bottom:34px"><svg class="mark" viewBox="0 0 100 100" style=""><circle cx="42.0" cy="56.7" r="6.91" fill="#5B8CFF"/><circle cx="50.27" cy="36.69" r="6.74" fill="#52668F"/><circle cx="59.2" cy="63.42" r="6.57" fill="#52668F"/><circle cx="30.17" cy="46.87" r="6.39" fill="#52668F"/><circle cx="67.19" cy="38.7" r="6.22" fill="#52668F"/><circle cx="42.97" cy="72.93" r="6.05" fill="#52668F"/><circle cx="37.37" cy="27.67" r="5.88" fill="#52668F"/><circle cx="74.59" cy="59.53" r="5.7" fill="#52668F"/><circle cx="22.45" cy="61.21" r="5.53" fill="#52668F"/><circle cx="61.95" cy="22.72" r="5.36" fill="#52668F"/><circle cx="58.61" cy="80.6" r="5.18" fill="#52668F"/><circle cx="20.3" cy="33.54" r="5.01" fill="#52668F"/><circle cx="82.89" cy="42.79" r="4.84" fill="#52668F"/><circle cx="28.42" cy="79.61" r="4.67" fill="#52668F"/><circle cx="44.3" cy="13.34" r="4.49" fill="#52668F"/><circle cx="78.45" cy="74.97" r="4.32" fill="#52668F"/><circle cx="9.52" cy="51.85" r="4.15" fill="#52668F"/><circle cx="77.95" cy="21.48" r="3.98" fill="#52668F"/><circle cx="47.15" cy="92.03" r="3.8" fill="#52668F"/><circle cx="21.57" cy="17.25" r="3.63" fill="#52668F"/><circle cx="92.69" cy="56.09" r="3.46" fill="#52668F"/></svg><span class="wm">Seed</span></div><h1 style="font-size:62px;max-width:12em"><i>Back the idea,</i> at one fixed price.</h1></div><p style="position:absolute;left:500px;bottom:56px;width:470px;color:var(--muted);font-size:18.5px;line-height:1.45">A raise sells its token at a price set by its target. Fill it and the whole raise opens a Meteora pool, locked for good. Miss it and every wallet is refunded, fee included.</p><div style="position:absolute;right:72px;bottom:52px;display:flex;gap:12px"><span class="btn btn-ink" style="height:50px;padding:0 26px;font-size:17px">Start a raise</span><span class="btn btn-ghost" style="height:50px;padding:0 26px;font-size:17px">How it works</span></div></div></body></html>
